<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>FADE</title>
  <!-- Google Fonts: Unbounded (headings) + Space Mono (technical data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- Embedded SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ─── Base Reset — Obsidian Matte ─── */
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100dvh; overflow: hidden; margin: 0; padding: 0;
      background: #09090b;
      color: #f4f4f5;
      font-family: 'Unbounded', sans-serif;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ─── Dot-Matrix Background ─── */
    #game.dot-bg::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
      z-index: 0;
    }
    /* Keep game content above the dots */
    #game.dot-bg > * { position: relative; z-index: 1; }
    #game.dot-bg #floatingContainer { z-index: 30; }
    #game.dot-bg #gameOverOverlay { z-index: 50; }

    /* ─── Card Flip 3D — Industrial Sharp ─── */
    .card { perspective: 800px; cursor: pointer; }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      will-change: transform;
    }
    .card-front {
      transform: rotateY(180deg);
      background: #18181b;
      border: 1px solid #27272a;
    }
    .card-back {
      background: #18181b;
      border: 1px solid #27272a;
    }
    .card-back::after {
      content: '';
      display: block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .card.matched .card-front {
      border-color: rgba(34,197,94,0.25);
    }
    .card.matched { pointer-events: none; }
    .card.mismatch .card-inner { animation: shake 0.15s ease; }

    /* ─── Flip card face-up glow ─── */
    .card.flipped .card-front {
      border-color: rgba(255,255,255,0.12);
    }

    /* ─── Animations ─── */
    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-6px); }
      40% { transform: rotateY(180deg) translateX(6px); }
      60% { transform: rotateY(180deg) translateX(-4px); }
      80% { transform: rotateY(180deg) translateX(4px); }
    }
    @keyframes matchPop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.18); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    .card.matched .card-inner { animation: matchPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      30% { opacity: 1; transform: translateY(-8px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }
    .combo-float {
      position: fixed; pointer-events: none; z-index: 200;
      font-size: 1rem; font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.5);
      animation: floatUp 0.5s ease-out forwards;
    }

    /* ─── Confetti burst ─── */
    @keyframes confettiBurst {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(540deg) scale(0.2); }
    }
    .confetti-piece {
      position: fixed; pointer-events: none; z-index: 200;
      border-radius: 2px;
      animation: confettiBurst 0.7s ease-out forwards;
    }

    /* ─── Adrenaline Mode ─── */
    #game.adrenaline-mode::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(220,38,38,0.18) 100%);
      pointer-events: none;
      z-index: 15;
      animation: adrenalinePulse 1s ease-in-out infinite;
    }
    @keyframes adrenalinePulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* ─── Timer bar glow ─── */
    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 6px rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 16px rgba(239,68,68,0.6); }
    }
    .timer-critical { animation: pulseGlow 0.8s ease-in-out infinite; }

    /* ─── Overlay ─── */
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.5); }
      60% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .overlay-content { animation: bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pulseBtn {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.1); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    }
    .btn-pulse { animation: pulseBtn 1.8s ease-in-out infinite; }

    /* ─── Grid fade-in ─── */
    .grid-fade-in { animation: gridFadeIn 0.3s ease-out; }
    @keyframes gridFadeIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ─── Feature Flag: COMPACT_HUD ─── */
    .compact-mode #hudFull { display: none; }
    #game:not(.compact-mode) #hudCompact { display: none; }

    /* ─── Feature Flag: VANISH_MATCHES ─── */
    .vanish-mode .card.matched {
      opacity: 0 !important;
      transition: opacity 0.4s ease !important;
      pointer-events: none !important;
    }
    .vanish-mode .card.matched .card-front {
      border-color: transparent !important;
    }

    /* ─── Responsive fine-tune ─── */
    @media (max-width:380px) {
      .card-face { border-radius: 4px; }
      .card-back::after { width: 4px; height: 4px; }
    }
    @media (min-width:500px) {
      .card-back::after { width: 8px; height: 8px; }
    }
  </style>
</head>
<body>

<div id="game" class="h-full w-full flex flex-col overflow-hidden">

  <!-- ═══ Timer Bar — electric cyan line ═══ -->
  <div class="flex-shrink-0 w-full" style="height:3px;">
    <div id="timerBarTop" class="h-full transition-all duration-150 ease-linear" style="width:100%;background:#22d3ee"></div>
  </div>

  <!-- ═══ Bento Box HUD (COMPACT_HUD) ═══ -->
  <div id="hudCompact" class="flex-shrink-0 mx-3 mt-3">
    <div class="grid grid-cols-5 gap-1.5">
      <!-- Left: FADE brand logo -->
      <div class="col-span-2 bg-zinc-900/30 border border-zinc-800/80 rounded-md p-2.5 flex items-center justify-center">
        <span class="font-black tracking-tighter text-4xl text-zinc-100 leading-none">FADE</span>
      </div>
      <!-- Right: stats + combo -->
      <div class="col-span-3 bg-zinc-900/30 border border-zinc-800/80 rounded-md px-2.5 py-2 flex items-center justify-between">
        <div class="flex items-center gap-1.5 font-mono text-[11px]">
          <span class="text-base leading-none">🏆</span>
          <span id="scoreDisplayCompact" class="font-bold text-zinc-100">0</span>
          <span class="text-zinc-700">/</span>
          <span class="text-[10px] text-zinc-500">🕹️</span>
          <span id="movesDisplayCompact" class="font-bold text-zinc-100">0</span>
        </div>
        <span id="comboDisplayCompact" class="hidden items-center gap-1 text-amber-400 font-bold font-mono text-xs">
          <span>🔥</span><span id="comboCountCompact">x0</span>
        </span>
      </div>
    </div>
  </div>

  <!-- ═══ Full Header (fallback, hidden in COMPACT_HUD) ═══ -->
  <div id="hudFull" class="flex-shrink-0 px-4 pt-3 pb-2">
    <span class="font-black tracking-tighter text-4xl text-zinc-100">FADE</span>
    <div class="flex items-center justify-between mt-1 font-mono text-xs">
      <div class="flex items-center gap-2">
        <span>🏆</span>
        <span id="scoreDisplay" class="font-bold text-zinc-100">0</span>
        <span class="text-zinc-600">/</span>
        <span class="text-zinc-500">🕹️</span>
        <span id="movesDisplay" class="font-bold text-zinc-100">0</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="comboDisplay" class="hidden items-center gap-1 text-amber-400 font-bold">🔥<span id="comboCount">x0</span></span>
        <span id="xrayStatus" class="text-zinc-600 opacity-40 text-[10px]">👁️</span>
      </div>
    </div>
  </div>

  <!-- ═══ Grid ═══ -->
  <div id="gridWrapper" class="flex-1 min-h-0 flex items-center justify-center px-3 pb-1 overflow-hidden" style="max-height:66vh">
    <div id="grid" class="grid grid-cols-4 gap-1.5 grid-fade-in"></div>
  </div>

  <!-- ═══ X-Ray Power-Up ═══ -->
  <div class="flex-shrink-0 pb-1.5 px-3 flex justify-center">
    <div class="bg-zinc-900/30 border border-zinc-800/80 rounded-md px-3 py-2 flex items-center gap-2">
      <button id="xrayBtn" class="font-mono font-bold text-[10px] text-zinc-100 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 rounded-sm px-3 py-1.5 transition-colors border border-zinc-700/60">
        👁️ X-RAY
      </button>
      <span class="font-mono text-[9px] text-zinc-600">peek once</span>
    </div>
  </div>

  <!-- ═══ Floating Text Container ═══ -->
  <div id="floatingContainer" class="fixed inset-0 pointer-events-none z-30"></div>

  <!-- ═══ Game Over Overlay ═══ -->
  <div id="gameOverOverlay" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-6">
    <div class="overlay-content flex flex-col items-center gap-3 w-full max-w-xs text-center bg-zinc-900/70 backdrop-blur-xl border border-zinc-800/80 shadow-2xl rounded-md px-6 py-7">
      <div id="overlayHeader" class="text-3xl mb-1">💀</div>
      <div id="overlayTitle" class="text-xl font-black tracking-tight text-zinc-100">Game Over</div>

      <div class="mt-1 text-center">
        <div class="text-4xl font-black tabular-nums text-zinc-100 font-mono"><span id="finalScore">0</span></div>
        <div class="text-[9px] text-zinc-600 uppercase tracking-widest mt-0.5 font-mono">Score</div>
      </div>

      <div class="flex items-center gap-6 mt-1 font-mono text-xs">
        <div class="text-center">
          <div class="text-base font-bold text-orange-400"><span id="finalCombo">0</span>x</div>
          <div class="text-[9px] text-zinc-600 uppercase tracking-wider">Best Combo</div>
        </div>
        <div class="text-center">
          <div class="text-base font-bold text-cyan-400"><span id="finalMoves">0</span></div>
          <div class="text-[9px] text-zinc-600 uppercase tracking-wider">Moves</div>
        </div>
      </div>

      <div id="benchmarkDisplay" class="text-[11px] mt-0.5 font-mono"></div>
      <div id="nearMissText" class="hidden text-xs text-red-400 font-mono mt-0.5"></div>

      <div class="mt-0.5 bg-zinc-900/30 border border-zinc-800/80 rounded-md px-4 py-2 w-full">
        <div class="text-[9px] text-zinc-600 uppercase tracking-widest mb-0.5 font-mono">Rank</div>
        <div id="rankDisplay" class="text-sm font-bold text-amber-400 font-mono">—</div>
      </div>

      <button id="shareBtn" class="w-full mt-0.5 font-mono font-bold text-[11px] flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 rounded-md px-4 py-2.5 text-zinc-100 transition-colors border border-zinc-700/60">
        <span>📤</span> Brag &amp; Share
      </button>

      <button id="replayBtn" class="btn-pulse w-full mt-0.5 font-mono font-bold text-[11px] bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 rounded-md px-4 py-2.5 text-zinc-100 transition-colors border border-zinc-700/60">
        🔄 Play Again
      </button>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════
//  FEATURE FLAGS
// ══════════════════════════════════════════════════════════════
const GAME_CONFIG = {
  COMPACT_HUD: true,
  VANISH_MATCHES: true,
  ACCELERATE_TIMER: true,
  CYBER_GRID_BG: true,
  EMOJI_SCALE_PERCENT: 80,
  GRID_ROWS: 6,
  GRID_COLS: 4,
};

// ══════════════════════════════════════════════════════════════
//  GAME CONSTANTS
// ══════════════════════════════════════════════════════════════
const TOTAL_PAIRS = Math.floor(GAME_CONFIG.GRID_ROWS * GAME_CONFIG.GRID_COLS / 2);
const START_TIME = 60;

const ALL_EMOJIS = [
  '💀','🤡','🧠','🔥','🤫','👑','💅','🤠',
  '🚀','👽','🥷','🥑','🦄','🌈','🎯','⚡',
  '🍕','🧩','🛸','🎸','🎪','🐲','🎨','🍭',
];

const GAME_URL = 'https://yaronbada.github.io/emoji-match/';
const BASE_SCORE = 100;
const COMBO_WINDOW = 2000;
const MATCH_TIME_BONUS = 2;
const GRID_GAP = 6;
const TIMER_INTERVAL = 100;
const ADRENALINE_THRESHOLD = 0.20;

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
const S = {
  score: 0,
  combo: 0,
  maxCombo: 0,
  moves: 0,
  flipHistory: [],
  timeLeft: START_TIME,
  maxTime: START_TIME,
  totalPairs: TOTAL_PAIRS,
  matchedPairs: 0,
  flippedIndices: [],
  cards: [],
  isProcessing: false,
  lastMatchTime: 0,
  timerId: null,
  gameActive: false,
  xrayUsed: false,
};

// ══════════════════════════════════════════════════════════════
//  DOM REFS
// ══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

const gridEl        = $('grid');
const gridWrapper   = $('gridWrapper');
const timerBarTop   = $('timerBarTop');
const scoreDisplay  = $('scoreDisplay');
const scoreDisplayCompact = $('scoreDisplayCompact');
const movesDisplay  = $('movesDisplay');
const movesDisplayCompact = $('movesDisplayCompact');
const comboDisplay  = $('comboDisplay');
const comboCount    = $('comboCount');
const comboDisplayCompact = $('comboDisplayCompact');
const comboCountCompact = $('comboCountCompact');
const floatContainer= $('floatingContainer');
const xrayBtn       = $('xrayBtn');
const xrayStatus    = $('xrayStatus');
const gameOverlay   = $('gameOverOverlay');
const overlayHeader = $('overlayHeader');
const overlayTitle  = $('overlayTitle');
const finalScore    = $('finalScore');
const finalCombo    = $('finalCombo');
const finalMoves    = $('finalMoves');
const benchmarkDisp = $('benchmarkDisplay');
const nearMissText  = $('nearMissText');
const rankDisplay   = $('rankDisplay');
const shareBtn      = $('shareBtn');
const replayBtn     = $('replayBtn');
const gameEl        = $('game');

// ══════════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getEmojisForLevel(count) {
  return shuffle([...ALL_EMOJIS]).slice(0, count);
}

function getSpiteRank(remaining) {
  if (remaining >= 7) return { title: 'TOTAL NOOB', subtitle: 'Brain Status: Cooked 🍳' };
  if (remaining >= 4) return { title: 'AVERAGE HUMAN', subtitle: 'Getting Warm... 🌶️' };
  if (remaining >= 1) return { title: 'CERTIFIED GIGABRAIN', subtitle: 'SO CLOSE! 😫' };
  return { title: 'ABSOLUTE LEGEND', subtitle: 'EMOJI DEITY 👑' };
}

// ══════════════════════════════════════════════════════════════
//  GRID
// ══════════════════════════════════════════════════════════════
function calculateCardSize() {
  const gap = GRID_GAP;
  const wrapper = gridWrapper;
  const pad = 12;
  const availW = wrapper.clientWidth - pad;
  const availH = wrapper.clientHeight - pad;
  const maxByW = (availW - (GAME_CONFIG.GRID_COLS - 1) * gap) / GAME_CONFIG.GRID_COLS;
  const maxByH = (availH - (GAME_CONFIG.GRID_ROWS - 1) * gap) / GAME_CONFIG.GRID_ROWS;
  return Math.max(28, Math.min(maxByW, maxByH));
}

function buildGrid() {
  S.totalPairs = TOTAL_PAIRS;
  S.matchedPairs = 0;
  S.cards = [];

  const emojis = getEmojisForLevel(TOTAL_PAIRS);
  const pairs = [...emojis, ...emojis];
  shuffle(pairs);

  const size = calculateCardSize();
  const emojiSize = Math.round(size * GAME_CONFIG.EMOJI_SCALE_PERCENT / 100);

  gridEl.style.gridTemplateColumns = `repeat(${GAME_CONFIG.GRID_COLS}, ${size}px)`;
  gridEl.style.gridTemplateRows = `repeat(${GAME_CONFIG.GRID_ROWS}, ${size}px)`;
  gridEl.style.gap = `${GRID_GAP}px`;
  gridEl.style.justifyContent = 'center';
  gridEl.style.alignContent = 'center';

  gridEl.classList.remove('grid-fade-in');
  void gridEl.offsetWidth;
  gridEl.classList.add('grid-fade-in');

  gridEl.innerHTML = '';
  S.flippedIndices = [];

  pairs.forEach((emoji, idx) => {
    const cardWrapper = document.createElement('div');
    cardWrapper.className = 'card';
    cardWrapper.dataset.index = idx;
    cardWrapper.style.width = `${size}px`;
    cardWrapper.style.height = `${size}px`;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    front.textContent = emoji;
    front.style.fontSize = `${emojiSize}px`;
    front.style.lineHeight = '1';

    inner.appendChild(back);
    inner.appendChild(front);
    cardWrapper.appendChild(inner);

    cardWrapper.addEventListener('click', () => onCardClick(idx));
    cardWrapper.addEventListener('touchstart', (e) => {
      e.preventDefault();
      onCardClick(idx);
    }, { passive: false });

    gridEl.appendChild(cardWrapper);

    S.cards.push({
      emoji,
      matched: false,
      flipped: false,
      element: cardWrapper,
      index: idx,
    });
  });
}

// ══════════════════════════════════════════════════════════════
//  CARD LOGIC
// ══════════════════════════════════════════════════════════════
function onCardClick(index) {
  if (!S.gameActive) return;
  if (S.isProcessing) return;

  const card = S.cards[index];
  if (!card || card.matched || card.flipped) return;
  if (S.flippedIndices.includes(index)) return;

  card.flipped = true;
  card.element.classList.add('flipped');
  S.flippedIndices.push(index);

  if (S.flippedIndices.length === 2) {
    S.isProcessing = true;
    S.moves++;
    movesDisplay.textContent = S.moves;
    movesDisplayCompact.textContent = S.moves;
    setTimeout(checkMatch, 400);
  }
}

function checkMatch() {
  const [i1, i2] = S.flippedIndices;
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  if (c1.emoji === c2.emoji) {
    handleMatch(i1, i2);
  } else {
    handleMismatch(i1, i2);
  }
}

function handleMatch(i1, i2) {
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  c1.matched = true;
  c2.matched = true;
  c1.element.classList.add('matched');
  c2.element.classList.add('matched');

  S.matchedPairs++;

  const now = performance.now();
  if (S.lastMatchTime && (now - S.lastMatchTime < COMBO_WINDOW)) {
    S.combo++;
  } else {
    S.combo = 0;
  }
  S.lastMatchTime = now;

  if (S.combo > S.maxCombo) S.maxCombo = S.combo;

  const multiplier = S.combo + 1;
  const points = BASE_SCORE * multiplier;
  S.score += points;

  addTime(MATCH_TIME_BONUS);

  const midX = (c1.element.getBoundingClientRect().left + c2.element.getBoundingClientRect().right) / 2;
  const midY = Math.min(c1.element.getBoundingClientRect().top, c2.element.getBoundingClientRect().top) - 14;
  const label = S.combo >= 1 ? `+${points}x${multiplier}` : `+${points}`;
  showFloatingText(label, midX, midY);

  if (S.combo >= 3) {
    spawnConfetti(midX, midY);
  }

  S.flipHistory.push(S.combo >= 3 ? '🔥' : '🟩');

  updateScore();
  updateComboDisplay();

  if (S.matchedPairs >= S.totalPairs) {
    setTimeout(victory, 700);
    S.flippedIndices = [];
    return;
  }

  S.flippedIndices = [];
  S.isProcessing = false;
}

function handleMismatch(i1, i2) {
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];
  const el1 = c1.element;
  const el2 = c2.element;

  el1.classList.add('mismatch');
  el2.classList.add('mismatch');

  S.combo = 0;
  updateComboDisplay();

  S.flipHistory.push('🟥');

  setTimeout(() => {
    el1.classList.remove('flipped','mismatch');
    el2.classList.remove('flipped','mismatch');
    c1.flipped = false;
    c2.flipped = false;
    S.flippedIndices = [];
    S.isProcessing = false;
  }, 500);
}

// ══════════════════════════════════════════════════════════════
//  X-RAY POWER-UP
// ══════════════════════════════════════════════════════════════
function activateXray() {
  if (!S.gameActive || S.xrayUsed) return;

  const faceDown = [];
  S.cards.forEach((card) => {
    if (!card.matched && !card.flipped) {
      faceDown.push(card);
    }
  });

  if (faceDown.length === 0) return;

  faceDown.forEach(card => { card.element.classList.add('flipped'); });

  setTimeout(() => {
    faceDown.forEach(card => {
      if (!card.matched) card.element.classList.remove('flipped');
    });
  }, 500);

  S.xrayUsed = true;
  xrayBtn.classList.add('opacity-40', 'pointer-events-none');
  xrayStatus.classList.remove('opacity-40');
  xrayStatus.textContent = '✗';
}

// ══════════════════════════════════════════════════════════════
//  FLOATING TEXT
// ══════════════════════════════════════════════════════════════
function showFloatingText(text, x, y) {
  const el = document.createElement('div');
  el.className = 'combo-float';
  el.textContent = text;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.style.transform = 'translate(-50%,-50%)';
  floatContainer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

// ══════════════════════════════════════════════════════════════
//  CONFETTI BURST
// ══════════════════════════════════════════════════════════════
function spawnConfetti(x, y) {
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ff9f43'];
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 25 + Math.random() * 60;
    const size = 3 + Math.random() * 5;
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${x}px; top:${y}px;
      width:${size}px; height:${size}px;
      background:${color};
      border-radius:${Math.random() > 0.5 ? '50%' : '1px'};
      --dx:${Math.cos(angle) * dist}px; --dy:${Math.sin(angle) * dist}px;
    `;
    floatContainer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

// ══════════════════════════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════════════════════════
function startTimer() {
  stopTimer();
  S.timeLeft = START_TIME;
  S.maxTime = START_TIME;
  updateTimerBar();
  S.timerId = setInterval(() => {
    const drainMultiplier = GAME_CONFIG.ACCELERATE_TIMER ? 1 + S.matchedPairs * 0.05 : 1;
    S.timeLeft -= (TIMER_INTERVAL / 1000) * drainMultiplier;
    if (S.timeLeft <= 0) {
      S.timeLeft = 0;
      updateTimerBar();
      gameOver();
    } else {
      updateTimerBar();
    }
  }, TIMER_INTERVAL);
}

function stopTimer() {
  if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
}

function addTime(sec) {
  S.timeLeft += sec;
  S.timeLeft = Math.min(S.timeLeft, S.maxTime + 5);
  updateTimerBar();
}

function updateTimerBar() {
  const pct = Math.max(0, (S.timeLeft / S.maxTime) * 100);
  timerBarTop.style.width = `${pct}%`;

  // Electric cyan → amber warning below 25%
  const color = pct <= 25 ? '#f59e0b' : '#22d3ee';
  timerBarTop.style.background = color;
  timerBarTop.classList.toggle('timer-critical', pct <= 10 && S.gameActive);

  const adrenaline = S.gameActive && pct <= ADRENALINE_THRESHOLD * 100;
  gameEl.classList.toggle('adrenaline-mode', adrenaline);
}

// ══════════════════════════════════════════════════════════════
//  UI UPDATES
// ══════════════════════════════════════════════════════════════
function updateScore() {
  scoreDisplay.textContent = S.score;
  scoreDisplayCompact.textContent = S.score;
  movesDisplay.textContent = S.moves;
  movesDisplayCompact.textContent = S.moves;
}

function updateComboDisplay() {
  const show = S.combo > 0;
  comboDisplay.classList.toggle('hidden', !show);
  comboDisplayCompact.classList.toggle('hidden', !show);
  comboCount.textContent = `x${S.combo + 1}`;
  comboCountCompact.textContent = `x${S.combo + 1}`;
}

// ══════════════════════════════════════════════════════════════
//  GAME OVER / VICTORY
// ══════════════════════════════════════════════════════════════
function gameOver() {
  S.gameActive = false;
  stopTimer();
  showOverlay('💀', 'Game Over');
}

function victory() {
  S.gameActive = false;
  stopTimer();
  showOverlay('🏆', 'Victory!');
}

function showOverlay(headerEmoji, titleText) {
  gameEl.classList.remove('adrenaline-mode');

  overlayHeader.textContent = headerEmoji;
  overlayTitle.textContent = titleText;
  finalScore.textContent = S.score;
  finalCombo.textContent = S.maxCombo + 1;
  finalMoves.textContent = S.moves;

  const avg = 32;
  const moves = S.moves;
  if (moves < avg) {
    benchmarkDisp.innerHTML = `<span class="text-emerald-400">${moves}</span> vs avg <span class="text-zinc-500">${avg}</span> · <span class="text-emerald-400">Elite 🧠</span>`;
  } else if (moves === avg) {
    benchmarkDisp.innerHTML = `<span class="text-amber-400">${moves}</span> vs avg <span class="text-zinc-500">${avg}</span> · <span class="text-amber-400">Average</span>`;
  } else {
    benchmarkDisp.innerHTML = `<span class="text-red-400">${moves}</span> vs avg <span class="text-zinc-500">${avg}</span>`;
  }

  const remaining = S.totalPairs - S.matchedPairs;
  const spite = getSpiteRank(remaining);
  rankDisplay.textContent = spite.title;
  nearMissText.textContent = spite.subtitle;
  nearMissText.classList.remove('hidden');

  gameOverlay.classList.remove('hidden');
}

// ══════════════════════════════════════════════════════════════
//  SHARE
// ══════════════════════════════════════════════════════════════
function shareScore() {
  const remaining = S.totalPairs - S.matchedPairs;
  const spite = getSpiteRank(remaining);

  let mapRows = [];
  for (let i = 0; i < S.flipHistory.length; i += 4) {
    mapRows.push(S.flipHistory.slice(i, i + 4).join(''));
  }
  const visualMap = mapRows.join('\n');

  const text = [
    `🧠 FADE: 24-CARD CHALLENGE 🧠`,
    `⏱️ ${Math.floor(S.timeLeft)}s | 🕹️ ${S.moves} (avg 32)`,
    `🔥 x${S.maxCombo + 1} | 👑 ${spite.title}`,
    ``,
    visualMap,
    ``,
    `⚡ ${GAME_URL}`,
  ].join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showShareCopied()).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showShareCopied(); } catch (e) { alert('Tap to copy:\n\n' + text); }
  document.body.removeChild(ta);
}

function showShareCopied() {
  shareBtn.innerHTML = 'Copied! 📋';
  shareBtn.classList.add('bg-emerald-800', 'border-emerald-700');
  shareBtn.classList.remove('bg-zinc-800', 'border-zinc-700/60');
  setTimeout(() => {
    shareBtn.innerHTML = '<span>📤</span> Brag &amp; Share';
    shareBtn.classList.remove('bg-emerald-800', 'border-emerald-700');
    shareBtn.classList.add('bg-zinc-800', 'border-zinc-700/60');
  }, 1500);
}

// ══════════════════════════════════════════════════════════════
//  RESTART
// ══════════════════════════════════════════════════════════════
function playAgain() {
  stopTimer();
  gameOverlay.classList.add('hidden');

  S.score = 0; S.combo = 0; S.maxCombo = 0; S.moves = 0;
  S.flipHistory = []; S.matchedPairs = 0; S.flippedIndices = [];
  S.isProcessing = false; S.gameActive = false; S.xrayUsed = false;

  xrayBtn.classList.remove('opacity-40', 'pointer-events-none');
  xrayStatus.classList.add('opacity-40');
  xrayStatus.textContent = '👁️';

  shareBtn.innerHTML = '<span>📤</span> Brag &amp; Share';
  shareBtn.classList.remove('bg-emerald-800', 'border-emerald-700');
  shareBtn.classList.add('bg-zinc-800', 'border-zinc-700/60');

  updateScore();
  updateComboDisplay();
  initGame();
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
function initGame() {
  S.gameActive = false;

  // Apply feature flags
  gameEl.classList.toggle('compact-mode', GAME_CONFIG.COMPACT_HUD);
  gameEl.classList.toggle('vanish-mode', GAME_CONFIG.VANISH_MATCHES);
  gameEl.classList.toggle('dot-bg', GAME_CONFIG.CYBER_GRID_BG);

  buildGrid();
  updateScore();
  updateComboDisplay();

  S.gameActive = true;
  startTimer();
}

// ─── Handle resize/orientation change ───
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (S.gameActive) {
      const matchedEmojis = S.cards.filter(c => c.matched).map(c => c.emoji);
      buildGrid();
      S.cards.forEach(c => {
        if (matchedEmojis.includes(c.emoji)) {
          c.matched = true;
          c.flipped = true;
          c.element.classList.add('flipped', 'matched');
        }
      });
    }
  }, 200);
});

// ─── Button hooks ───
xrayBtn.addEventListener('click', activateXray);
shareBtn.addEventListener('click', shareScore);
replayBtn.addEventListener('click', playAgain);

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') playAgain();
  if (e.key === 'x' || e.key === 'X') activateXray();
});

// ─── Go! ───
initGame();
</script>

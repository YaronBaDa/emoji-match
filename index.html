<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>Emoji Match</title>
  <!-- Google Fonts: Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Embedded SVG Favicon (brain emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ─── Base Reset — Premium Dark Glass ─── */
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100dvh; overflow: hidden; margin: 0; padding: 0;
      background: radial-gradient(ellipse at top, #1e293b, #0f172a, #09090b);
      color: #f1f5f9;
      font-family: 'Space Grotesk', sans-serif;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ─── Card Flip 3D ─── */
    .card { perspective: 800px; cursor: pointer; }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      will-change: transform;
    }
    .card-front {
      transform: rotateY(180deg);
      background: linear-gradient(145deg,#1e293b,#0f172a);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.4);
    }
    .card-back {
      background: linear-gradient(145deg,#1e1b4b,#312e81);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 4px 12px rgba(0,0,0,0.4);
    }
    .card-back::after {
      content: '?'; font-size: 1rem; font-weight: 800;
      color: rgba(255,255,255,0.15); line-height: 1;
    }
    .card.matched .card-front {
      box-shadow: 0 0 20px rgba(34,197,94,0.35), inset 0 0 0 1px rgba(34,197,94,0.3);
    }
    .card.matched { pointer-events: none; }
    .card.mismatch .card-inner { animation: shake 0.15s ease; }

    /* ─── Animations ─── */
    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-6px); }
      40% { transform: rotateY(180deg) translateX(6px); }
      60% { transform: rotateY(180deg) translateX(-4px); }
      80% { transform: rotateY(180deg) translateX(4px); }
    }
    @keyframes matchPop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.18); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    .card.matched .card-inner { animation: matchPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      30% { opacity: 1; transform: translateY(-8px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }
    .combo-float {
      position: fixed; pointer-events: none; z-index: 200;
      font-size: 1.25rem; font-weight: 800;
      color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.6), 0 2px 8px rgba(0,0,0,0.5);
      animation: floatUp 0.5s ease-out forwards;
    }

    /* ─── Confetti burst ─── */
    @keyframes confettiBurst {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(540deg) scale(0.2); }
    }
    .confetti-piece {
      position: fixed; pointer-events: none; z-index: 200;
      border-radius: 2px;
      animation: confettiBurst 0.7s ease-out forwards;
    }

    /* ─── Adrenaline Mode — full-screen pulse ─── */
    #game.adrenaline-mode::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(220,38,38,0.18) 100%);
      pointer-events: none;
      z-index: 15;
      animation: adrenalinePulse 1s ease-in-out infinite;
    }
    @keyframes adrenalinePulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* ─── Timer bar glow ─── */
    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 8px rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 24px rgba(239,68,68,0.8); }
    }
    .timer-critical { animation: pulseGlow 0.8s ease-in-out infinite; }

    /* ─── Overlay ─── */
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.5); }
      60% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .overlay-content { animation: bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pulseBtn {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99,102,241,0.5); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 12px rgba(99,102,241,0); }
    }
    .btn-pulse { animation: pulseBtn 1.8s ease-in-out infinite; }

    /* ─── Grid fade-in ─── */
    .grid-fade-in { animation: gridFadeIn 0.3s ease-out; }
    @keyframes gridFadeIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ─── Responsive fine-tune ─── */
    @media (max-width:380px) {
      .card-back::after { font-size: 0.85rem; }
      .card-face { border-radius: 8px; }
      .combo-float { font-size: 1rem; }
    }
    @media (min-width:500px) {
      .card-back::after { font-size: 1.2rem; }
    }

    /* ─── Feature Flag: COMPACT_HUD ─── */
    .compact-mode #hudFull { display: none; }
    #game:not(.compact-mode) #hudCompact { display: none; }
    #hudFull, #hudCompact { transition: all 0.3s ease; }

    /* ─── Feature Flag: VANISH_MATCHES ─── */
    .vanish-mode .card.matched {
      opacity: 0 !important;
      transition: opacity 0.45s ease !important;
      pointer-events: none !important;
    }
    .vanish-mode .card.matched .card-front {
      box-shadow: none !important;
    }

    /* ─── Feature Flag: CYBER_GRID_BG ─── */
    .cyber-bg::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

<div id="game" class="h-full w-full flex flex-col overflow-hidden">

  <!-- ═══ Full Header Panel (hidden in COMPACT_HUD) ═══ -->
  <div id="hudFull" class="flex-shrink-0 mx-3 mt-3 rounded-2xl bg-slate-900/60 backdrop-blur-md border border-white/10 shadow-2xl px-4 pt-3 pb-2">
    <!-- Timer bar inside the glass panel -->
    <div class="w-full h-[5px] bg-gray-800/40 rounded-full overflow-hidden mb-3">
      <div id="timerBar" class="h-full rounded-full transition-all duration-150 ease-linear" style="width:100%;background:#22c55e"></div>
    </div>

    <!-- Logo row -->
    <div class="flex items-center justify-between">
      <span class="bg-gradient-to-r from-cyan-400 via-indigo-400 to-fuchsia-500 bg-clip-text text-transparent font-black tracking-tighter text-xl sm:text-2xl">EMOJI MATCH</span>

      <!-- Combo (appears when active) -->
      <span id="comboDisplay" class="hidden items-center gap-1 text-amber-400 font-extrabold tracking-tight text-xs">
        <span>🔥</span><span id="comboCount">x0</span>
      </span>
    </div>

    <!-- Stats row -->
    <div class="flex items-center justify-between mt-1 text-xs">
      <div class="flex items-center gap-2">
        <span class="text-base">🏆</span>
        <span id="scoreDisplay" class="font-extrabold tracking-tight text-white tabular-nums text-sm">0</span>
        <span class="text-gray-700">|</span>
        <span class="text-[10px] text-gray-500 uppercase tracking-wider">🕹️</span>
        <span id="movesDisplay" class="font-extrabold tracking-tight text-white tabular-nums text-sm">0</span>
      </div>
      <div class="flex items-center gap-1 text-[10px] text-gray-500 uppercase tracking-wider">
        <span id="xrayStatus" class="opacity-40">👁️</span>
      </div>
    </div>
  </div>

  <!-- ═══ Compact HUD (shown in COMPACT_HUD mode) ═══ -->
  <div id="hudCompact" class="flex-shrink-0 mx-3 mt-3 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-white/10 shadow-2xl px-3 py-2.5">
    <div class="flex items-center justify-between gap-1">
      <!-- Left: timer bar vertical strip + stats -->
      <div class="flex items-center gap-2 flex-1 min-w-0">
        <div class="w-[3px] h-7 bg-gray-800/40 rounded-full overflow-hidden flex-shrink-0">
          <div id="timerBarCompact" class="w-full rounded-full transition-all duration-150 ease-linear" style="height:100%;background:#22c55e"></div>
        </div>
        <div class="flex items-center gap-1.5 min-w-0 text-xs">
          <span>🏆</span>
          <span id="scoreDisplayCompact" class="font-extrabold tracking-tight text-white tabular-nums text-sm">0</span>
          <span class="text-gray-600">·</span>
          <span class="text-[10px] text-gray-400">🕹️</span>
          <span id="movesDisplayCompact" class="font-extrabold tracking-tight text-white tabular-nums text-sm">0</span>
        </div>
      </div>
      <!-- Right: logo + combo -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="bg-gradient-to-r from-cyan-400 via-indigo-400 to-fuchsia-500 bg-clip-text text-transparent font-black tracking-tighter text-sm">EMOJI MATCH</span>
        <span id="comboDisplayCompact" class="hidden items-center gap-0.5 text-amber-400 font-extrabold tracking-tight text-[10px]">
          <span>🔥</span><span id="comboCountCompact">x0</span>
        </span>
      </div>
    </div>
  </div>

  <!-- ═══ Grid ═══ -->
  <div id="gridWrapper" class="flex-1 min-h-0 flex items-center justify-center px-3 pb-2 overflow-hidden">
    <div id="grid" class="grid grid-cols-4 gap-2 grid-fade-in"></div>
  </div>

  <!-- ═══ X-Ray Power-Up (Glass container) ═══ -->
  <div class="flex-shrink-0 pb-2 px-3 flex justify-center">
    <div class="bg-slate-900/90 backdrop-blur-md border border-white/10 shadow-2xl rounded-xl px-3 py-2 flex items-center gap-2">
      <button id="xrayBtn" class="flex items-center gap-1 bg-indigo-600/90 hover:bg-indigo-500 active:bg-indigo-700 rounded-full px-3.5 py-1.5 text-[11px] font-bold text-white transition-all shadow-lg shadow-indigo-600/30">
        👁️ X-RAY
      </button>
      <span class="text-[10px] text-gray-500 font-medium">Peek once</span>
    </div>
  </div>

  <!-- ═══ Floating Text Container ═══ -->
  <div id="floatingContainer" class="fixed inset-0 pointer-events-none z-30"></div>

  <!-- ═══ Game Over Overlay (Glass Modal) ═══ -->
  <div id="gameOverOverlay" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-6">
    <div class="overlay-content flex flex-col items-center gap-4 w-full max-w-xs text-center bg-slate-900/70 backdrop-blur-xl border border-white/10 shadow-2xl rounded-3xl px-6 py-7">
      <!-- Header -->
      <div id="overlayHeader" class="text-4xl mb-1">💀</div>
      <div id="overlayTitle" class="text-2xl font-black tracking-tight text-white">Game Over</div>

      <!-- Score -->
      <div class="mt-1 text-center">
        <div class="text-5xl font-black tabular-nums text-white"><span id="finalScore">0</span></div>
        <div class="text-[10px] text-gray-500 uppercase tracking-widest mt-0.5 font-medium">Score</div>
      </div>

      <!-- Stats row -->
      <div class="flex items-center gap-6 mt-1 text-sm">
        <div class="text-center">
          <div class="text-lg font-extrabold tracking-tight text-orange-400"><span id="finalCombo">0</span>x</div>
          <div class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Best Combo</div>
        </div>
        <div class="text-center">
          <div class="text-lg font-extrabold tracking-tight text-sky-400"><span id="finalMoves">0</span></div>
          <div class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Moves</div>
        </div>
      </div>

      <!-- Benchmark -->
      <div id="benchmarkDisplay" class="text-xs mt-1 font-medium"></div>

      <!-- Near-miss text -->
      <div id="nearMissText" class="hidden text-sm text-red-400 font-semibold mt-1"></div>

      <!-- Rank -->
      <div class="mt-1 bg-white/5 backdrop-blur-sm rounded-2xl px-5 py-2.5 border border-white/10 w-full">
        <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-0.5 font-medium">Rank</div>
        <div id="rankDisplay" class="text-lg font-extrabold tracking-tight text-amber-400">—</div>
      </div>

      <!-- Share -->
      <button id="shareBtn" class="w-full mt-1 flex items-center justify-center gap-2 bg-white/10 hover:bg-white/15 active:bg-white/20 backdrop-blur-sm rounded-2xl px-5 py-3 text-sm font-bold transition-colors border border-white/10">
        <span>📤</span> <span>Brag &amp; Share</span>
      </button>

      <!-- Play Again -->
      <button id="replayBtn" class="btn-pulse w-full mt-1 bg-gradient-to-r from-indigo-600 to-fuchsia-600 hover:from-indigo-500 hover:to-fuchsia-500 active:from-indigo-700 active:to-fuchsia-700 rounded-2xl px-5 py-3.5 text-sm font-bold text-white transition-all shadow-lg shadow-indigo-600/30">
        🔄 Play Again
      </button>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════
//  FEATURE FLAGS — toggle on/off from here
// ══════════════════════════════════════════════════════════════
const GAME_CONFIG = {
  COMPACT_HUD: true,        // Single-row slim header
  VANISH_MATCHES: true,     // Matched cards fade to opacity-0
  CYBER_GRID_BG: true,      // Pure CSS background matrix pattern
  EMOJI_SCALE_PERCENT: 80,  // Emoji at 80% of card size
  GRID_ROWS: 6,
  GRID_COLS: 4,
};

// ══════════════════════════════════════════════════════════════
//  GAME CONSTANTS
// ══════════════════════════════════════════════════════════════
const TOTAL_PAIRS = Math.floor(GAME_CONFIG.GRID_ROWS * GAME_CONFIG.GRID_COLS / 2);
const START_TIME = 60;

const ALL_EMOJIS = [
  '💀','🤡','🧠','🔥','🤫','👑','💅','🤠',
  '🚀','👽','🥷','🥑','🦄','🌈','🎯','⚡',
  '🍕','🧩','🛸','🎸','🎪','🐲','🎨','🍭',
];

const GAME_URL = 'https://yaronbada.github.io/emoji-match/';
const BASE_SCORE = 100;
const COMBO_WINDOW = 2000;
const MATCH_TIME_BONUS = 2;
const GRID_GAP = 8;
const TIMER_INTERVAL = 100;
const ADRENALINE_THRESHOLD = 0.20;

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
const S = {
  score: 0,
  combo: 0,
  maxCombo: 0,
  moves: 0,
  flipHistory: [],
  timeLeft: START_TIME,
  maxTime: START_TIME,
  totalPairs: TOTAL_PAIRS,
  matchedPairs: 0,
  flippedIndices: [],
  cards: [],
  isProcessing: false,
  lastMatchTime: 0,
  timerId: null,
  gameActive: false,
  xrayUsed: false,
};

// ══════════════════════════════════════════════════════════════
//  DOM REFS
// ══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

const gridEl        = $('grid');
const gridWrapper   = $('gridWrapper');
const timerBar      = $('timerBar');
const timerBarCompact = $('timerBarCompact');
const scoreDisplay  = $('scoreDisplay');
const scoreDisplayCompact = $('scoreDisplayCompact');
const movesDisplay  = $('movesDisplay');
const movesDisplayCompact = $('movesDisplayCompact');
const comboDisplay  = $('comboDisplay');
const comboCount    = $('comboCount');
const comboDisplayCompact = $('comboDisplayCompact');
const comboCountCompact = $('comboCountCompact');
const floatContainer= $('floatingContainer');
const xrayBtn       = $('xrayBtn');
const xrayStatus    = $('xrayStatus');
const gameOverlay   = $('gameOverOverlay');
const overlayHeader = $('overlayHeader');
const overlayTitle  = $('overlayTitle');
const finalScore    = $('finalScore');
const finalCombo    = $('finalCombo');
const finalMoves    = $('finalMoves');
const benchmarkDisp = $('benchmarkDisplay');
const nearMissText  = $('nearMissText');
const rankDisplay   = $('rankDisplay');
const shareBtn      = $('shareBtn');
const replayBtn     = $('replayBtn');
const gameEl        = $('game');

// ══════════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getEmojisForLevel(count) {
  return shuffle([...ALL_EMOJIS]).slice(0, count);
}

function getSpiteRank(remaining) {
  if (remaining >= 7) return { title: 'Total Noob', subtitle: 'Brain Status: Cooked 🍳' };
  if (remaining >= 4) return { title: 'Average Human', subtitle: 'Getting Warm... 🌶️' };
  if (remaining >= 1) return { title: 'Certified Gigabrain', subtitle: 'SO CLOSE! 😫' };
  return { title: 'Absolute Legend', subtitle: 'EMOJI DEITY 👑' };
}

// ══════════════════════════════════════════════════════════════
//  GRID
// ══════════════════════════════════════════════════════════════
function calculateCardSize() {
  const gap = GRID_GAP;
  const wrapper = gridWrapper;
  const pad = 12;
  const availW = wrapper.clientWidth - pad;
  const availH = wrapper.clientHeight - pad;
  const maxByW = (availW - (GAME_CONFIG.GRID_COLS - 1) * gap) / GAME_CONFIG.GRID_COLS;
  const maxByH = (availH - (GAME_CONFIG.GRID_ROWS - 1) * gap) / GAME_CONFIG.GRID_ROWS;
  return Math.max(32, Math.min(maxByW, maxByH));
}

function buildGrid() {
  S.totalPairs = TOTAL_PAIRS;
  S.matchedPairs = 0;
  S.cards = [];

  const emojis = getEmojisForLevel(TOTAL_PAIRS);
  const pairs = [...emojis, ...emojis];
  shuffle(pairs);

  const size = calculateCardSize();
  const emojiSize = Math.round(size * GAME_CONFIG.EMOJI_SCALE_PERCENT / 100);

  gridEl.style.gridTemplateColumns = `repeat(${GAME_CONFIG.GRID_COLS}, ${size}px)`;
  gridEl.style.gridTemplateRows = `repeat(${GAME_CONFIG.GRID_ROWS}, ${size}px)`;
  gridEl.style.gap = `${GRID_GAP}px`;
  gridEl.style.justifyContent = 'center';
  gridEl.style.alignContent = 'center';

  gridEl.classList.remove('grid-fade-in');
  void gridEl.offsetWidth;
  gridEl.classList.add('grid-fade-in');

  gridEl.innerHTML = '';
  S.flippedIndices = [];

  pairs.forEach((emoji, idx) => {
    const cardWrapper = document.createElement('div');
    cardWrapper.className = 'card';
    cardWrapper.dataset.index = idx;
    cardWrapper.style.width = `${size}px`;
    cardWrapper.style.height = `${size}px`;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    front.textContent = emoji;
    front.style.fontSize = `${emojiSize}px`;
    front.style.lineHeight = '1';

    inner.appendChild(back);
    inner.appendChild(front);
    cardWrapper.appendChild(inner);

    cardWrapper.addEventListener('click', () => onCardClick(idx));
    cardWrapper.addEventListener('touchstart', (e) => {
      e.preventDefault();
      onCardClick(idx);
    }, { passive: false });

    gridEl.appendChild(cardWrapper);

    S.cards.push({
      emoji,
      matched: false,
      flipped: false,
      element: cardWrapper,
      index: idx,
    });
  });
}

// ══════════════════════════════════════════════════════════════
//  CARD LOGIC
// ══════════════════════════════════════════════════════════════
function onCardClick(index) {
  if (!S.gameActive) return;
  if (S.isProcessing) return;

  const card = S.cards[index];
  if (!card || card.matched || card.flipped) return;
  if (S.flippedIndices.includes(index)) return;

  card.flipped = true;
  card.element.classList.add('flipped');
  S.flippedIndices.push(index);

  if (S.flippedIndices.length === 2) {
    S.isProcessing = true;
    S.moves++;
    movesDisplay.textContent = S.moves;
    setTimeout(checkMatch, 400);
  }
}

function checkMatch() {
  const [i1, i2] = S.flippedIndices;
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  if (c1.emoji === c2.emoji) {
    handleMatch(i1, i2);
  } else {
    handleMismatch(i1, i2);
  }
}

function handleMatch(i1, i2) {
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  c1.matched = true;
  c2.matched = true;
  c1.element.classList.add('matched');
  c2.element.classList.add('matched');

  S.matchedPairs++;

  const now = performance.now();
  if (S.lastMatchTime && (now - S.lastMatchTime < COMBO_WINDOW)) {
    S.combo++;
  } else {
    S.combo = 0;
  }
  S.lastMatchTime = now;

  if (S.combo > S.maxCombo) S.maxCombo = S.combo;

  const multiplier = S.combo + 1;
  const points = BASE_SCORE * multiplier;
  S.score += points;

  addTime(MATCH_TIME_BONUS);

  const midX = (c1.element.getBoundingClientRect().left + c2.element.getBoundingClientRect().right) / 2;
  const midY = Math.min(c1.element.getBoundingClientRect().top, c2.element.getBoundingClientRect().top) - 14;
  const label = S.combo >= 1 ? `+${points} Combo x${multiplier}!` : `+${points}`;
  showFloatingText(label, midX, midY);

  if (S.combo >= 3) {
    spawnConfetti(midX, midY);
  }

  S.flipHistory.push(S.combo >= 3 ? '🔥' : '🟩');

  updateScore();
  updateComboDisplay();

  if (S.matchedPairs >= S.totalPairs) {
    setTimeout(victory, 700);
    S.flippedIndices = [];
    return;
  }

  S.flippedIndices = [];
  S.isProcessing = false;
}

function handleMismatch(i1, i2) {
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];
  const el1 = c1.element;
  const el2 = c2.element;

  el1.classList.add('mismatch');
  el2.classList.add('mismatch');

  S.combo = 0;
  updateComboDisplay();

  S.flipHistory.push('🟥');

  setTimeout(() => {
    el1.classList.remove('flipped','mismatch');
    el2.classList.remove('flipped','mismatch');
    c1.flipped = false;
    c2.flipped = false;
    S.flippedIndices = [];
    S.isProcessing = false;
  }, 500);
}

// ══════════════════════════════════════════════════════════════
//  X-RAY POWER-UP
// ══════════════════════════════════════════════════════════════
function activateXray() {
  if (!S.gameActive || S.xrayUsed) return;

  const faceDown = [];
  S.cards.forEach((card) => {
    if (!card.matched && !card.flipped) {
      faceDown.push(card);
    }
  });

  if (faceDown.length === 0) return;

  faceDown.forEach(card => {
    card.element.classList.add('flipped');
  });

  setTimeout(() => {
    faceDown.forEach(card => {
      if (!card.matched) {
        card.element.classList.remove('flipped');
      }
    });
  }, 500);

  S.xrayUsed = true;
  xrayBtn.classList.add('opacity-40', 'pointer-events-none');
  xrayStatus.classList.remove('opacity-40');
  xrayStatus.textContent = '✗';
}

// ══════════════════════════════════════════════════════════════
//  FLOATING TEXT
// ══════════════════════════════════════════════════════════════
function showFloatingText(text, x, y) {
  const el = document.createElement('div');
  el.className = 'combo-float';
  el.textContent = text;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.style.transform = 'translate(-50%,-50%)';
  floatContainer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

// ══════════════════════════════════════════════════════════════
//  CONFETTI BURST
// ══════════════════════════════════════════════════════════════
function spawnConfetti(x, y) {
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ff9f43','#00d2d3','#a29bfe'];
  for (let i = 0; i < 24; i++) {
    const el = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 70;
    const size = 4 + Math.random() * 6;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${x}px; top:${y}px;
      width:${size}px; height:${size}px;
      background:${color};
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      --dx:${dx}px; --dy:${dy}px;
    `;
    floatContainer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

// ══════════════════════════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════════════════════════
function startTimer() {
  stopTimer();
  S.timeLeft = START_TIME;
  S.maxTime = START_TIME;
  updateTimerBar();
  S.timerId = setInterval(() => {
    S.timeLeft -= TIMER_INTERVAL / 1000;
    if (S.timeLeft <= 0) {
      S.timeLeft = 0;
      updateTimerBar();
      gameOver();
    } else {
      updateTimerBar();
    }
  }, TIMER_INTERVAL);
}

function stopTimer() {
  if (S.timerId) {
    clearInterval(S.timerId);
    S.timerId = null;
  }
}

function addTime(sec) {
  S.timeLeft += sec;
  S.timeLeft = Math.min(S.timeLeft, S.maxTime + 5);
  updateTimerBar();
}

function updateTimerBar() {
  const pct = Math.max(0, (S.timeLeft / S.maxTime) * 100);
  timerBar.style.width = `${pct}%`;
  timerBarCompact.style.height = `${pct}%`;

  let color;
  let critical = false;
  if (pct > 50) {
    color = '#22c55e';
  } else if (pct > 25) {
    color = '#eab308';
  } else if (pct > 10) {
    color = '#ef4444';
  } else {
    color = '#ef4444';
    critical = true;
  }
  timerBar.style.background = color;
  timerBarCompact.style.background = color;
  timerBar.classList.toggle('timer-critical', critical && S.gameActive);
  timerBarCompact.classList.toggle('timer-critical', critical && S.gameActive);

  const adrenaline = S.gameActive && pct <= ADRENALINE_THRESHOLD * 100;
  gameEl.classList.toggle('adrenaline-mode', adrenaline);
}

// ══════════════════════════════════════════════════════════════
//  UI UPDATES
// ══════════════════════════════════════════════════════════════
function updateScore() {
  scoreDisplay.textContent = S.score;
  scoreDisplayCompact.textContent = S.score;
  movesDisplay.textContent = S.moves;
  movesDisplayCompact.textContent = S.moves;
}

function updateComboDisplay() {
  if (S.combo > 0) {
    comboDisplay.classList.remove('hidden');
    comboDisplayCompact.classList.remove('hidden');
    comboCount.textContent = `x${S.combo + 1}`;
    comboCountCompact.textContent = `x${S.combo + 1}`;
  } else {
    comboDisplay.classList.add('hidden');
    comboDisplayCompact.classList.add('hidden');
  }
}

// ══════════════════════════════════════════════════════════════
//  GAME OVER / VICTORY
// ══════════════════════════════════════════════════════════════
function gameOver() {
  S.gameActive = false;
  stopTimer();
  showOverlay('💀', 'Game Over');
}

function victory() {
  S.gameActive = false;
  stopTimer();
  showOverlay('🏆', 'Victory!');
}

function showOverlay(headerEmoji, titleText) {
  gameEl.classList.remove('adrenaline-mode');

  overlayHeader.textContent = headerEmoji;
  overlayTitle.textContent = titleText;
  finalScore.textContent = S.score;
  finalCombo.textContent = S.maxCombo + 1;
  finalMoves.textContent = S.moves;

  const avg = 32;
  const moves = S.moves;
  if (moves < avg) {
    benchmarkDisp.innerHTML = `Your Moves: <span class="text-emerald-400 font-bold">${moves}</span> vs. Average Human: ${avg} &nbsp;·&nbsp; <span class="text-emerald-400 font-bold">Brain Status: Elite 🧠</span>`;
  } else if (moves === avg) {
    benchmarkDisp.innerHTML = `Your Moves: <span class="text-amber-400 font-bold">${moves}</span> vs. Average Human: ${avg} &nbsp;·&nbsp; <span class="text-amber-400">Right on average</span>`;
  } else {
    benchmarkDisp.innerHTML = `Your Moves: <span class="text-red-400 font-bold">${moves}</span> vs. Average Human: ${avg}`;
  }

  const remaining = S.totalPairs - S.matchedPairs;
  const spite = getSpiteRank(remaining);
  rankDisplay.textContent = spite.title;

  if (headerEmoji === '💀' && remaining > 0) {
    nearMissText.textContent = spite.subtitle;
    nearMissText.classList.remove('hidden');
  } else {
    nearMissText.textContent = spite.subtitle;
    nearMissText.classList.remove('hidden');
  }

  gameOverlay.classList.remove('hidden');
}

// ══════════════════════════════════════════════════════════════
//  SHARE
// ══════════════════════════════════════════════════════════════
function shareScore() {
  const remaining = S.totalPairs - S.matchedPairs;
  const spite = getSpiteRank(remaining);

  let mapRows = [];
  for (let i = 0; i < S.flipHistory.length; i += 4) {
    mapRows.push(S.flipHistory.slice(i, i + 4).join(''));
  }
  const visualMap = mapRows.join('\n');

  const text = [
    `🧠 EMOJI MATCH: 24-CARD CHALLENGE 🧠`,
    `⏱️ Time Left: ${Math.floor(S.timeLeft)}s | 🕹️ Moves: ${S.moves} (Avg: 32)`,
    `🔥 Max Combo: x${S.maxCombo + 1} | 👑 Rank: ${spite.title}`,
    ``,
    visualMap,
    ``,
    `Can you beat my brain? ⚡ ${GAME_URL}`,
  ].join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showShareCopied();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showShareCopied();
  } catch (e) {
    alert('Tap to copy:\n\n' + text);
  }
  document.body.removeChild(ta);
}

function showShareCopied() {
  shareBtn.innerHTML = 'Copied! 📋';
  shareBtn.classList.add('bg-emerald-600/30', 'border-emerald-500/40', 'text-emerald-300');
  setTimeout(() => {
    shareBtn.innerHTML = '<span>📤</span> <span>Brag &amp; Share</span>';
    shareBtn.classList.remove('bg-emerald-600/30', 'border-emerald-500/40', 'text-emerald-300');
  }, 1500);
}

// ══════════════════════════════════════════════════════════════
//  RESTART
// ══════════════════════════════════════════════════════════════
function playAgain() {
  stopTimer();
  gameOverlay.classList.add('hidden');

  S.score = 0;
  S.combo = 0;
  S.maxCombo = 0;
  S.moves = 0;
  S.flipHistory = [];
  S.matchedPairs = 0;
  S.flippedIndices = [];
  S.isProcessing = false;
  S.gameActive = false;
  S.xrayUsed = false;

  xrayBtn.classList.remove('opacity-40', 'pointer-events-none');
  xrayStatus.classList.add('opacity-40');
  xrayStatus.textContent = '👁️';

  shareBtn.innerHTML = '<span>📤</span> <span>Brag &amp; Share</span>';
  shareBtn.classList.remove('bg-emerald-600/30', 'border-emerald-500/40', 'text-emerald-300');

  updateScore();
  updateComboDisplay();
  initGame();
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
function initGame() {
  S.gameActive = false;

  // Apply feature flags
  gameEl.classList.toggle('compact-mode', GAME_CONFIG.COMPACT_HUD);
  gameEl.classList.toggle('vanish-mode', GAME_CONFIG.VANISH_MATCHES);
  gameEl.classList.toggle('cyber-bg', GAME_CONFIG.CYBER_GRID_BG);

  buildGrid();
  updateScore();
  updateComboDisplay();

  S.gameActive = true;
  startTimer();
}

// ─── Handle resize/orientation change ───
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (S.gameActive) {
      const matchedEmojis = S.cards.filter(c => c.matched).map(c => c.emoji);
      buildGrid();
      S.cards.forEach(c => {
        if (matchedEmojis.includes(c.emoji)) {
          c.matched = true;
          c.flipped = true;
          c.element.classList.add('flipped', 'matched');
        }
      });
    }
  }, 200);
});

// ─── Button hooks ───
xrayBtn.addEventListener('click', activateXray);
shareBtn.addEventListener('click', shareScore);
replayBtn.addEventListener('click', playAgain);

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') playAgain();
  if (e.key === 'x' || e.key === 'X') activateXray();
});

// ─── Go! ───
initGame();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>FADE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100dvh; overflow: hidden; margin: 0; padding: 0;
      background: #09090b;
      color: #f4f4f5;
      font-family: 'Unbounded', sans-serif;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ─── Screens ─── */
    .screen { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
    .screen.active { display: flex; }

    /* ─── Board Background Patterns ─── */
    /*
      DELETE the old dot-matrix block below and replace with ONE of the
      three .board-bg variants further down. The default (Variant A) is
      already wired in. All patterns are pure CSS, dark, and static.
    */
    #gameScreen.board-bg {
      background-color: #09090b;
      background-image:
        radial-gradient(circle at 40% 40%, rgba(255,255,255,0.022) 0.5px, transparent 1px),
        radial-gradient(circle at 60% 60%, rgba(255,255,255,0.018) 0.5px, transparent 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    /* Ensure content stays above any pseudo-elements */
    #gameScreen.board-bg > * { position: relative; z-index: 1; }
    #gameScreen.board-bg #floatingContainer { z-index: 30; }
    #gameScreen.board-bg #gameOverOverlay { z-index: 50; }

    /* ═══ Variant B: Fading Diagonal Weave ═══
       Swap in by replacing the #gameScreen.board-bg block above with:

    #gameScreen.board-bg {
      background-color: #09090b;
      background-image:
        repeating-linear-gradient(
          45deg,
          transparent, transparent 7px,
          rgba(255,255,255,0.015) 7px,
          rgba(255,255,255,0.015) 8px
        ),
        repeating-linear-gradient(
          -45deg,
          transparent, transparent 7px,
          rgba(255,255,255,0.012) 7px,
          rgba(255,255,255,0.012) 8px
        );
    }
    */

    /* ═══ Variant C: Dissolving Scanlines ═══
       Swap in by replacing the #gameScreen.board-bg block above with:

    #gameScreen.board-bg {
      background-color: #09090b;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent, transparent 3px,
          rgba(255,255,255,0.012) 3px,
          rgba(255,255,255,0.012) 4px
        );
      background-size: 100% 14px;
    }
    */

    /* ─── Landing / Menu ─── */
    #landingScreen { background: #09090b; }

    .menu-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 16px;
      gap: 16px;
      overflow-y: auto;
    }

    /* 1. Title as fading letter-cards */
    .title-cards {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .title-card {
      width: 56px;
      height: 56px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: titleFade 3s ease-in-out infinite;
    }
    .title-card:nth-child(1) { animation-delay: 0s; }
    .title-card:nth-child(2) { animation-delay: 0.5s; }
    .title-card:nth-child(3) { animation-delay: 1.0s; }
    .title-card:nth-child(4) { animation-delay: 1.5s; }
    .title-letter {
      font-size: 24px;
      font-weight: 900;
      color: #f4f4f5;
      line-height: 1;
    }
    @keyframes titleFade {
      0%, 100% { opacity: 1; filter: none; }
      50% { opacity: 0.15; filter: grayscale(1) brightness(0.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .title-card { animation: none !important; opacity: 1 !important; filter: none !important; }
    }

    /* 2. Explainer */
    .menu-explainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .menu-tagline {
      font-size: 12px;
      color: #a1a1aa;
      text-align: center;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .menu-howto-btn {
      font-size: 11px;
      color: #22d3ee;
      background: none;
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      font-family: 'Unbounded', sans-serif;
    }
    .menu-howto-btn:active { opacity: 0.7; }

    /* 3. Daily Challenge — Primary Hero */
    .daily-hero {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(135deg, rgba(34,211,238,0.12) 0%, rgba(34,211,238,0.03) 100%);
      border: 1px solid rgba(34,211,238,0.35);
      border-radius: 12px;
      padding: 18px 16px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .daily-hero:hover { border-color: rgba(34,211,238,0.6); }
    .daily-hero:active { transform: scale(0.98); }
    .daily-hero.locked {
      background: rgba(39,39,42,0.4);
      border-color: #27272a;
      cursor: default;
    }
    .daily-hero.locked:hover { border-color: #27272a; }
    .daily-hero.locked:active { transform: none; }
    .daily-hero-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #22d3ee;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .daily-hero-date { font-size: 14px; font-weight: 700; color: #f4f4f5; }
    .daily-hero-streak {
      font-size: 20px;
      font-weight: 800;
      color: #fbbf24;
      margin-top: 6px;
    }
    .daily-hero-countdown {
      font-size: 11px;
      color: #a1a1aa;
      margin-top: 8px;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.02em;
    }

    /* 4. Practice — Demoted, collapsible */
    .practice-section {
      width: 100%;
      max-width: 360px;
    }
    .practice-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px 14px;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Unbounded', sans-serif;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .practice-toggle:hover { border-color: #3f3f46; }
    .practice-toggle:active { transform: scale(0.98); }
    .practice-chevron {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 14px;
    }
    .practice-toggle[aria-expanded="true"] .practice-chevron { transform: rotate(90deg); }
    .practice-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease-out;
    }
    .practice-panel.open { max-height: 400px; }
    .practice-tiers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 8px;
    }
    .practice-tier {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px 10px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .practice-tier:hover { border-color: #3f3f46; background: #1c1c1f; }
    .practice-tier:active { transform: scale(0.97); }
    .practice-tier-name { font-size: 12px; font-weight: 700; color: #f4f4f5; margin-bottom: 2px; }
    .practice-tier-count { font-size: 10px; color: #a1a1aa; font-family: 'Space Mono', monospace; }
    .practice-tier-stat {
      font-size: 9px;
      color: #71717a;
      margin-top: 4px;
      font-family: 'Space Mono', monospace;
    }

    /* 5. Settings */
    .settings-trigger {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #18181b;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      z-index: 30;
    }
    .settings-trigger:hover { border-color: #3f3f46; color: #f4f4f5; }

    /* Modals */
    .menu-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .menu-modal.hidden { display: none; }
    .menu-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
    }
    .menu-modal-panel {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 20px;
    }
    .menu-modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: #71717a;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .menu-modal-title {
      font-size: 14px;
      font-weight: 800;
      color: #f4f4f5;
      margin: 0 0 10px;
    }
    .menu-modal-body {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.5;
      margin: 0;
    }
    .settings-list { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #d4d4d8;
    }
    .settings-check {
      width: 18px;
      height: 18px;
      accent-color: #22d3ee;
      cursor: pointer;
    }

    /* ─── Card Flip 3D ─── */
    .card { perspective: 800px; cursor: pointer; }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      will-change: transform;
    }
    .card-front {
      transform: rotateY(180deg);
      background: #18181b;
      border: 1px solid #27272a;
    }
    .card-back {
      background: #18181b;
      border: 1px solid #27272a;
    }
    .card-back::after {
      content: '';
      display: block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .card.matched .card-front {
      border-color: rgba(34,197,94,0.25);
    }
    .card.matched { pointer-events: none; }
    .card.mismatch .card-inner { animation: shake 0.15s ease; }
    .card.flipped .card-front {
      border-color: rgba(255,255,255,0.12);
    }

    /* ─── Visual Fade Decay on Cards ─── */
    .card-face {
      transition: filter 1.2s ease, opacity 1.2s ease, border-color 1.2s ease;
    }
    .card.faded-1 .card-face { filter: saturate(0.65); border-color: rgba(255,255,255,0.06); }
    .card.faded-2 .card-face { filter: saturate(0.35) grayscale(0.4); border-color: rgba(255,255,255,0.04); opacity: 0.85; }
    .card.faded-3 .card-face { filter: saturate(0.15) grayscale(0.7); border-color: rgba(255,255,255,0.03); opacity: 0.60; }
    .card.faded-4 .card-face { filter: saturate(0) grayscale(1); border-color: rgba(255,255,255,0.02); opacity: 0.30; }
    .card.faded-5 .card-face { filter: saturate(0) grayscale(1); border-color: transparent; opacity: 0; }

    /* ─── Animations ─── */
    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-6px); }
      40% { transform: rotateY(180deg) translateX(6px); }
      60% { transform: rotateY(180deg) translateX(-4px); }
      80% { transform: rotateY(180deg) translateX(4px); }
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      30% { opacity: 1; transform: translateY(-8px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }
    .combo-float {
      position: fixed; pointer-events: none; z-index: 200;
      font-size: 1rem; font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.5);
      animation: floatUp 0.5s ease-out forwards;
    }

    @keyframes comboPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); color: #fff; text-shadow: 0 0 16px rgba(251,191,36,0.8); }
      100% { transform: scale(1); }
    }
    .combo-pulse { animation: comboPulse 0.35s cubic-bezier(0.34,1.56,0.64,1); }

    @keyframes confettiBurst {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(540deg) scale(0.2); }
    }
    .confetti-piece {
      position: fixed; pointer-events: none; z-index: 200;
      border-radius: 2px;
      animation: confettiBurst 0.7s ease-out forwards;
    }

    @keyframes adrenalinePulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    #gameScreen.adrenaline-mode::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(220,38,38,0.18) 100%);
      pointer-events: none;
      z-index: 15;
      animation: adrenalinePulse 1s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 6px rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 16px rgba(239,68,68,0.6); }
    }
    .timer-critical { animation: pulseGlow 0.8s ease-in-out infinite; }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.5); }
      60% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .overlay-content {
      animation: bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
      margin-top: auto;
      margin-bottom: auto;
    }
    @keyframes pulseBtn {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.1); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    }
    .btn-pulse { animation: pulseBtn 1.8s ease-in-out infinite; }

    .grid-fade-in { animation: gridFadeIn 0.3s ease-out; }
    @keyframes gridFadeIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ─── Tempo Map ─── */
    .tempo-map { display: grid; gap: 2px; justify-content: center; }
    .tempo-cell {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }
    .tempo-fast { background: rgba(34,197,94,0.25); }
    .tempo-med  { background: rgba(251,191,36,0.25); }
    .tempo-slow { background: rgba(239,68,68,0.25); }
    .tempo-empty { background: rgba(39,39,42,0.5); }
    .tempo-legend {
      display: flex; justify-content: center; gap: 8px;
      font-size: 10px; color: #a1a1aa;
      font-family: 'Space Mono', monospace;
      margin-top: 4px;
    }

    /* ─── Victory Banner ─── */
    #victoryBanner {
      position: fixed; top: 12%; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 40; pointer-events: none;
      opacity: 0; transform: scale(0.5);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    #victoryBanner.show {
      opacity: 1; transform: scale(1);
    }
    #victoryBanner .victory-text {
      font-size: 48px; font-weight: 900;
      letter-spacing: -0.04em;
      color: #f4f4f5;
      text-shadow: 0 0 40px rgba(34,211,238,0.4), 0 0 80px rgba(34,211,238,0.15);
      background: rgba(9,9,11,0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 8px 28px;
    }

    /* ─── Feature Flags ─── */
    .compact-mode #hudFull { display: none; }
    #gameScreen:not(.compact-mode) #hudCompact { display: none; }
    .vanish-mode .card.matched {
      opacity: 0 !important;
      transition: opacity 0.4s ease !important;
      pointer-events: none !important;
    }
    .vanish-mode .card.matched .card-front {
      border-color: transparent !important;
    }

    @media (max-width:380px) {
      .card-face { border-radius: 4px; }
      .card-back::after { width: 4px; height: 4px; }
      .hero-board { width: 140px; gap: 6px; }
      .hero-card { font-size: 18px; border-radius: 4px; }
    }
    @media (min-width:500px) {
      .card-back::after { width: 8px; height: 8px; }
    }

    /* ─── Underlay Figurative Reveal ─── */
    /* A large emoji changes every day. Matched cards do a fun pop   */
    /* animation then disappear completely, progressively revealing  */
    /* the daily mystery figure beneath. Bg stays dim during play,   */
    /* brightens + sparkles on victory.                                */
    #gridWrapper { position: relative; }

    #underlayGrid {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Matched cards: fun pop animation then disappear completely */
    @keyframes matchVanish {
      0%   { transform: scale(1); opacity: 1; }
      25%  { transform: scale(1.18) rotate(4deg); opacity: 1; }
      50%  { transform: scale(1.08) rotate(-2deg); opacity: 0.9; }
      75%  { transform: scale(0.5); opacity: 0.3; }
      100% { transform: scale(0); opacity: 0; }
    }
    .reveal-mode .card.matched {
      animation: matchVanish 0.55s cubic-bezier(0.4,0,0.2,1) forwards;
      pointer-events: none;
    }
    .reveal-mode .card.matched .card-front {
      border-color: rgba(34,197,94,0.35) !important;
    }

    /* ─── Golden Pair Glow ─── */
    @keyframes goldenPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.35); }
      50% { box-shadow: 0 0 14px 3px rgba(251,191,36,0.45); }
    }
    .golden-pair .card-inner {
      animation: goldenPulse 1.4s ease-in-out infinite;
      border-radius: 6px;
    }
    .golden-pair .card-front {
      border-color: rgba(251,191,36,0.6) !important;
    }

    /* ─── Mimic Trap Flash ─── */
    @keyframes mimicFlash {
      0%,100% { border-color: rgba(239,68,68,0.25); }
      50% { border-color: rgba(239,68,68,0.9); box-shadow: 0 0 10px rgba(239,68,68,0.4); }
    }
    .mimic-trap .card-inner {
      animation: mimicFlash 0.7s ease-in-out infinite;
    }
    .mimic-trap .card-front {
      border-color: rgba(239,68,68,0.5) !important;
    }

    /* ─── Screen Shake ─── */
    @keyframes screenShake {
      0%,100% { transform: translate(0,0); }
      10% { transform: translate(-10px,-5px); }
      20% { transform: translate(10px,5px); }
      30% { transform: translate(-8px,8px); }
      40% { transform: translate(8px,-8px); }
      50% { transform: translate(-5px,-5px); }
      60% { transform: translate(5px,5px); }
      70% { transform: translate(-3px,3px); }
      80% { transform: translate(3px,-3px); }
    }
    .screen-shake {
      animation: screenShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* ─── X-Ray Auto Flash Overlay ─── */
    @keyframes xrayFlashOverlay {
      0% { opacity: 0; }
      8% { opacity: 1; background: radial-gradient(circle at center, rgba(34,211,238,0.18) 0%, transparent 65%); }
      92% { opacity: 1; background: radial-gradient(circle at center, rgba(34,211,238,0.18) 0%, transparent 65%); }
      100% { opacity: 0; }
    }
    .xray-flash-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 25;
      animation: xrayFlashOverlay 0.6s ease-out forwards;
    }

    /* ─── Special Ability Animations ─── */
    #gameStatusAnnouncer {
      position: fixed; top: 14%; left: 5%; right: 5%; z-index: 90;
      display: flex; justify-content: center; pointer-events: none;
      opacity: 0; transform: translateY(-12px) scale(0.96);
      transition: opacity 0.35s cubic-bezier(.4,0,.2,1), transform 0.35s cubic-bezier(.4,0,.2,1);
    }
    #gameStatusAnnouncer.show { opacity: 1; transform: translateY(0) scale(1); }
    .banner-inner {
      padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 700;
      letter-spacing: 0.5px; text-align: center; max-width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    }
    .banner-clairvoyance { background: rgba(91,33,182,0.85); color: #e9d5ff; border: 1px solid rgba(139,92,246,0.5); }
    .banner-timewarp   { background: rgba(14,165,233,0.85); color: #e0f2fe; border: 1px solid rgba(56,189,248,0.5); }

// ══════════════════════════════════════════════════════════════
//  DETERMINISTIC SEEDING (Daily)
// ══════════════════════════════════════════════════════════════
function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return (h1^h2^h3^h4)>>>0;
}

function mulberry32(a) {
  return function() {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function getTodayUTC() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function getDailySeed() {
  return cyrb128(getTodayUTC() + '_fade_daily_v1');
}

// ══════════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ══════════════════════════════════════════════════════════════
//  DECK GENERATION (ability floor + deterministic daily)
// ══════════════════════════════════════════════════════════════
function createRng(seed) {
  if (seed != null) return mulberry32(seed);
  return Math.random;
}

function getAbilityEmojis() {
  return Object.values(GAME_CONFIG.ABILITY_TRIGGERS);
}

function getRegularEmojis() {
  const abilitySet = new Set(getAbilityEmojis());
  return ALL_EMOJIS.filter(e => !abilitySet.has(e));
}

function pickN(arr, n, rng) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

function generateDeck(pairCount, seed) {
  const rng = createRng(seed);
  const abilities = getAbilityEmojis();
  const regulars = getRegularEmojis();

  let abilityCount;
  if (FORCE_ALL_ABILITIES) {
    abilityCount = Math.min(abilities.length, pairCount);
  } else {
    const min = Math.min(ABILITY_MIN, pairCount, abilities.length);
    const max = Math.min(ABILITY_MAX, pairCount, abilities.length);
    const range = max - min + 1;
    abilityCount = min + Math.floor(rng() * range);
  }

  const chosenAbilities = pickN(abilities, abilityCount, rng);
  const chosenRegulars  = pickN(regulars, pairCount - abilityCount, rng);
  const deckEmojis = [...chosenAbilities, ...chosenRegulars];

  // Shuffle the selected emoji set
  for (let i = deckEmojis.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [deckEmojis[i], deckEmojis[j]] = [deckEmojis[j], deckEmojis[i]];
  }

  // Build pairs and shuffle positions
  const pairs = [...deckEmojis, ...deckEmojis];
  for (let i = pairs.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }

  // TEMP: debug log
  if (DEBUG_DECK) {
    const abilitySet = new Set(abilities);
    const abilityPositions = pairs
      .map((e, i) => abilitySet.has(e) ? `${e}@${i}` : null)
      .filter(Boolean);
    const seedLabel = seed != null ? `seed=${seed}` : 'seed=random';
    console.log(
      `[FADE DEBUG] ${seedLabel} mode=${seed != null ? 'daily' : 'practice'} ` +
      `pairCount=${pairCount} abilityCount=${abilityCount} ` +
      `deck=[${deckEmojis.join('')}] positions=[${abilityPositions.join(', ')}]`
    );
  }

  return pairs;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m > 0 ? `${m}:${s.toString().padStart(2,'0')}` : `0:${s.toString().padStart(2,'0')}`;
}

//  GRID
// ══════════════════════════════════════════════════════════════
function calculateCardSize() {
  const gap = GRID_GAP;
  const wrapper = gridWrapper;
  const pad = 12;
  const availW = wrapper.clientWidth - pad;
  const availH = wrapper.clientHeight - pad;
  const maxByW = (availW - (GAME_CONFIG.GRID_COLS - 1) * gap) / GAME_CONFIG.GRID_COLS;
  const maxByH = (availH - (GAME_CONFIG.GRID_ROWS - 1) * gap) / GAME_CONFIG.GRID_ROWS;
  return Math.max(28, Math.min(maxByW, maxByH));
}

function buildGrid() {
  const count = GAME_CONFIG.GRID_ROWS * GAME_CONFIG.GRID_COLS;
  S.totalPairs = Math.floor(count / 2);
  S.matchedPairs = 0;
  S.cards = [];
  S.totalFlips = 0;
  S.flipCounts = new Array(count).fill(0);
  S.pairFlipCounts = {};
  S.bombTriggered = false;
  const seed = S.mode === "daily" ? getDailySeed() : null;
  const pairs = generateDeck(S.totalPairs, seed);
  S.emojis = [...new Set(pairs)];
  const size = calculateCardSize();
  const emojiSize = Math.round(size * GAME_CONFIG.EMOJI_SCALE_PERCENT / 100);
  gridEl.style.gridTemplateColumns = `repeat(${GAME_CONFIG.GRID_COLS}, ${size}px)`;
  gridEl.style.gridTemplateRows = `repeat(${GAME_CONFIG.GRID_ROWS}, ${size}px)`;
  gridEl.style.gap = `${GRID_GAP}px`; gridEl.style.justifyContent = "center"; gridEl.style.alignContent = "center";
  gridEl.classList.remove("grid-fade-in"); void gridEl.offsetWidth; gridEl.classList.add("grid-fade-in");
  gridEl.innerHTML = ""; S.flippedIndices = [];
  buildUnderlayGrid(size, pairs.length);
  pairs.forEach((emoji, idx) => {
    const cardWrapper = document.createElement("div"); cardWrapper.className = "card"; cardWrapper.dataset.index = idx;
    cardWrapper.style.width = `${size}px`; cardWrapper.style.height = `${size}px`;
    const inner = document.createElement("div"); inner.className = "card-inner";
    const back = document.createElement("div"); back.className = "card-face card-back";
    const front = document.createElement("div"); front.className = "card-face card-front"; front.textContent = emoji;
    front.style.fontSize = `${emojiSize}px`; front.style.lineHeight = "1";
    inner.appendChild(back); inner.appendChild(front); cardWrapper.appendChild(inner);
    cardWrapper.addEventListener("click", () => onCardClick(idx));
    cardWrapper.addEventListener("touchstart", (e) => { e.preventDefault(); onCardClick(idx); }, { passive: false });
    gridEl.appendChild(cardWrapper);
    S.cards.push({ emoji, matched: false, flipped: false, element: cardWrapper, index: idx });
  });
}

// ══════════════════════════════════════════════════════════════
//  CARD LOGIC
// ══════════════════════════════════════════════════════════════
function onCardClick(index) {
  if (!S.gameActive) return;
  if (S.isProcessing) return;
  if (S.isBoardLocked) return;
  if (S.clairvoyanceActive) return;
  const card = S.cards[index];
  if (!card || card.matched || card.flipped) return;
  if (S.flippedIndices.includes(index)) return;
  if (S.firstFlipTime === 0) { S.firstFlipTime = performance.now(); startTimer(); }
  card.flipped = true; card.element.classList.add("flipped");
  S.flippedIndices.push(index); S.totalFlips++; S.flipCounts[index]++;
  S.pairFlipCounts[card.emoji] = (S.pairFlipCounts[card.emoji] || 0) + 1;
  if (S.flippedIndices.length === 2) {
    S.isProcessing = true; S.moves++;
    movesDisplay.textContent = S.moves; movesDisplayCompact.textContent = S.moves;
    setTimeout(checkMatch, 400);
  }
}

function checkMatch() {
  const [i1, i2] = S.flippedIndices;
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  if (c1.emoji === c2.emoji) {
    handleMatch(i1, i2);
  } else {
    handleMismatch(i1, i2);
  }
}

function handleMatch(i1, i2) {
  const c1 = S.cards[i1]; const c2 = S.cards[i2];
  c1.matched = true; c2.matched = true;
  c1.element.classList.add("matched"); c2.element.classList.add("matched");
  S.matchedPairs++;
  const now = performance.now();
  if (S.lastMatchTime && (now - S.lastMatchTime < 2000)) S.combo++; else S.combo = 0;
  S.lastMatchTime = now; if (S.combo > S.maxCombo) S.maxCombo = S.combo;
  const midX = (c1.element.getBoundingClientRect().left + c2.element.getBoundingClientRect().right) / 2;
  const midY = Math.min(c1.element.getBoundingClientRect().top, c2.element.getBoundingClientRect().top) - 14;
  let multiplier = S.combo + 1; const points = BASE_SCORE * multiplier; S.score += points;
  const label = S.combo >= 1 ? `+${points}x${multiplier}` : `+${points}`;
  showFloatingText(label, midX, midY);
  S.flipHistory.push(S.combo >= 3 ? "🔥" : "🟩");
  S.pairTimes.push(performance.now() - S.firstFlipTime);
  const emoji = c1.emoji;
  // Recovery type: placeholder heuristic until fade-state detection is wired
  const pairFlips = (S.pairFlipCounts[emoji] || 0);
  let recovery = 'cool';
  if (pairFlips > 4) recovery = 'clutch';
  // TODO: wire real fade-state detection here for 'faded'
  S.pairRecoveryTypes.push(recovery);
  const ab = GAME_CONFIG.ABILITY_TRIGGERS;
  if (emoji === ab.CLAIRVOYANCE) { triggerClairvoyance(); }
  else if (emoji === ab.TIMEWARP) { triggerTimeWarp(midX, midY); }
  else if (emoji === ab.LOCKDOWN) { triggerSecurityLockdown(); }
  else if (emoji === ab.DETONATION) { triggerClusterBomb(); }
  updateScore(); updateComboDisplay();
  if (S.matchedPairs >= S.totalPairs) { setTimeout(victory, 700); S.flippedIndices = []; return; }
  S.flippedIndices = []; S.isProcessing = false;
}

function handleMismatch(i1, i2) {
  const c1 = S.cards[i1]; const c2 = S.cards[i2];
  const el1 = c1.element; const el2 = c2.element;
  el1.classList.add("mismatch"); el2.classList.add("mismatch");
  S.combo = 0; updateComboDisplay();
  S.flipHistory.push("🟥");
  setTimeout(() => {
    el1.classList.remove("flipped","mismatch"); el2.classList.remove("flipped","mismatch");
    c1.flipped = false; c2.flipped = false;
    S.flippedIndices = []; S.isProcessing = false;
  }, 500);
}

function getGridLayout(count) {
  // Portrait mobile: prefer fewer columns so grid is taller than wide
  let cols = Math.floor(Math.sqrt(count));
  cols = Math.max(3, cols);
  let rows = Math.ceil(count / cols);
  // If grid is wider than tall, reduce columns until it's portrait-friendly
  while (rows < cols && cols > 3) {
    cols--;
    rows = Math.ceil(count / cols);
  }
  return { cols, rows };
}

function showBanner(msg, cssClass) {
  if (!gameStatusAnnouncer || !bannerInner) return;
  bannerInner.textContent = msg;
  bannerInner.className = "banner-inner " + cssClass;
  gameStatusAnnouncer.classList.add("show");
  setTimeout(() => { gameStatusAnnouncer.classList.remove("show"); }, 2200);
}

function updateElapsedDisplay() {
  const mins = Math.floor(S.elapsedTime / 60);
  const secs = Math.floor(S.elapsedTime % 60);
  const frac = Math.floor((S.elapsedTime % 1) * 100);
  const text = `${mins}:${secs.toString().padStart(2,"0")}.${frac.toString().padStart(2,"0")}`;
  if (elapsedDisplayCompact) elapsedDisplayCompact.textContent = text;
  updateTimerBar();
}

function triggerClairvoyance() {
  S.isBoardLocked = true;
  S.clairvoyanceActive = true;
  showBanner("🔮 CLAIRVOYANCE: Photographic memory test!", "banner-clairvoyance");
  const unrevealed = S.cards.filter(c => !c.matched && !c.flipped);

  setTimeout(() => {
    unrevealed.forEach(c => { c.element.classList.remove("clairvoyance-flip"); });
    S.clairvoyanceActive = false;

}

function triggerTimeWarp(midX, midY) {

function triggerSecurityLockdown() {
  S.isBoardLocked = true;
  showBanner("🔓 SECURITY LOCKDOWN: Inputs frozen for 3s!", "banner-lockdown");
  const wrapper = document.getElementById("gridWrapper");
  let overlay = wrapper.querySelector(".freeze-overlay");

function triggerClusterBomb() {
  if (S.bombTriggered) return;
  S.bombTriggered = true;
  showBanner("💣 DETONATION: 4 new cards added to the grid!", "banner-detonation");
  const grid = document.getElementById("grid");
  grid.classList.add("explosion-shake");
  setTimeout(() => grid.classList.remove("explosion-shake"), 600);
  const backup = ALL_EMOJIS.filter(e => !S.emojis.includes(e));
  if (backup.length < 2) return;
  const newEmojis = backup.slice(0, 2);
  S.emojis.push(...newEmojis);
  S.totalPairs += 2;
  const size = calculateCardSize();
  const emojiSize = Math.round(size * GAME_CONFIG.EMOJI_SCALE_PERCENT / 100);
  newEmojis.forEach((emoji) => {
    for (let k = 0; k < 2; k++) {
      const idx = S.cards.length;
      const wrapper = document.createElement("div");
      wrapper.className = "card";
      wrapper.dataset.index = idx;
      wrapper.style.width = `${size}px`;
      wrapper.style.height = `${size}px`;
      const inner = document.createElement("div");
      inner.className = "card-inner";
      const back = document.createElement("div");
      back.className = "card-face card-back";
      const front = document.createElement("div");
      front.className = "card-face card-front";
      front.textContent = emoji;
      front.style.fontSize = `${emojiSize}px`;
      front.style.lineHeight = "1";
      inner.appendChild(back);
      inner.appendChild(front);
      wrapper.appendChild(inner);
      wrapper.addEventListener("click", () => onCardClick(idx));
      wrapper.addEventListener("touchstart", (e) => {
        e.preventDefault();
        onCardClick(idx);
      }, { passive: false });
      grid.appendChild(wrapper);
      S.cards.push({ emoji, matched: false, flipped: false, element: wrapper, index: idx });
      S.flipCounts.push(0);
    }
  });
  const count = S.cards.length;
  const dims = getGridLayout(count);
  GAME_CONFIG.GRID_COLS = dims.cols;
  GAME_CONFIG.GRID_ROWS = dims.rows;
  grid.style.gridTemplateColumns = `repeat(${dims.cols}, ${size}px)`;
  grid.style.gridTemplateRows = `repeat(${dims.rows}, ${size}px)`;
  buildUnderlayGrid(size, count);
}


function gameOver() {
  S.gameActive = false; stopTimer();
  if (S.boardLockTimer) { clearTimeout(S.boardLockTimer); S.boardLockTimer = null; }
  S.isBoardLocked = false; gameEl.classList.remove("board-locked");
  if (victoryBanner) { victoryBanner.classList.remove("show"); victoryBanner.classList.add("hidden"); }
  showOverlay();
}

function victory() {
  S.gameActive = false; stopTimer();
  if (S.boardLockTimer) { clearTimeout(S.boardLockTimer); S.boardLockTimer = null; }
  S.isBoardLocked = false; gameEl.classList.remove("board-locked");
  if (victoryBanner) { victoryBanner.classList.remove("hidden"); void victoryBanner.offsetWidth; victoryBanner.classList.add("show"); }
  setTimeout(() => {
    if (victoryBanner) { victoryBanner.classList.remove("show"); setTimeout(() => victoryBanner.classList.add("hidden"), 400); }
    showOverlay();
  }, 3000);
}

function showOverlay() {
  gameEl.classList.remove("adrenaline-mode");
  const hudCompact = document.getElementById("hudCompact");
  const hudFull = document.getElementById("hudFull");
  const timerBar = document.getElementById("timerBarTop");
  if (hudCompact) hudCompact.classList.add("hidden");
  if (hudFull) hudFull.classList.add("hidden");
  if (timerBar) timerBar.parentElement.classList.add("hidden");
  const elapsed = S.firstFlipTime ? ((performance.now() - S.firstFlipTime) / 60000).toFixed(1) : "0.0";
  if (summaryStats) { summaryStats.textContent = `${S.moves} moves · ${elapsed} min`; }
  if (overlayTitle) { overlayTitle.textContent = S.matchedPairs >= S.totalPairs ? 'Victory!' : 'Game Over'; }
  if (percentileDisplay) {
    const pct = computePercentile(S.score || 0);
    percentileDisplay.textContent = `Top ${pct}%`;
  }
  if (verdictDisplay) {
    verdictDisplay.textContent = generateVerdict();
  }
  renderTempoMap();
  if (S.mode === "daily") {
    tomorrowCountdown.classList.remove("hidden"); updateTomorrowCountdown();
    if (!window._tomorrowInterval) window._tomorrowInterval = setInterval(updateTomorrowCountdown, 1000);
  } else { tomorrowCountdown.classList.add("hidden"); }
  gameOverlay.classList.remove("hidden");
  persistStats(S.matchedPairs >= S.totalPairs);
}

function computePercentile(score) {
  for (let i = PERCENTILE_CURVE.length - 1; i >= 0; i--) {
    if (score >= PERCENTILE_CURVE[i].min) {
      // Add slight daily variance so it feels organic
      const seed = cyrb128(getTodayUTC() + '_pct');
      const variance = (seed % 5) - 2; // -2 to +2
      return Math.max(1, Math.min(99, PERCENTILE_CURVE[i].pct + variance));
    }
  }
  return 99;
}

function renderTempoMap() {
  // One cell per CARD, showing how many times that specific card was flipped.
  tempoMapEl.innerHTML = '';
  const totalCards = S.flipCounts.length;

  // Choose columns so the grid stays compact (aim for ≤4 rows)
  const cols = Math.min(6, Math.max(4, Math.ceil(totalCards / 4)));
  tempoMapEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;

  let cheetahCount = 0, rabbitCount = 0, turtleCount = 0, unusedCount = 0;

  for (let i = 0; i < totalCards; i++) {
    const flips = S.flipCounts[i] || 0;
    const cell = document.createElement('div');
    cell.className = 'tempo-cell';

    // Animal emoji mapping based on flip count
    if (flips === 0) {
      cell.textContent = '·';
      cell.classList.add('tempo-empty');
      unusedCount++;
    } else if (flips <= 2) {
      cell.textContent = '🐆';
      cell.classList.add('tempo-fast');
      cheetahCount++;
    } else if (flips <= 5) {
      cell.textContent = '🐇';
      cell.classList.add('tempo-med');
      rabbitCount++;
    } else {
      cell.textContent = '🐢';
      cell.classList.add('tempo-slow');
      turtleCount++;
    }
    tempoMapEl.appendChild(cell);
  }

  // Build legend
  if (tempoLegendEl) {
    const parts = [];
    if (cheetahCount) parts.push(`🐆 ${cheetahCount}`);
    if (rabbitCount)  parts.push(`🐇 ${rabbitCount}`);
    if (turtleCount)  parts.push(`🐢 ${turtleCount}`);
    if (unusedCount)  parts.push(`· ${unusedCount}`);
    tempoLegendEl.textContent = parts.join('  ·  ');
  }
}

function generateVerdict() {
  const times = S.pairTimes;
  if (times.length < 3) return 'Keep practicing.';

  // Split into quartiles
  const q1 = times.slice(0, Math.ceil(times.length * 0.25));
  const q2 = times.slice(Math.ceil(times.length * 0.25), Math.ceil(times.length * 0.5));
  const q3 = times.slice(Math.ceil(times.length * 0.5), Math.ceil(times.length * 0.75));
  const q4 = times.slice(Math.ceil(times.length * 0.75));

  const avg = arr => arr.reduce((a,b) => a+b,0) / (arr.length||1);
  const a1 = avg(q1), a2 = avg(q2), a3 = avg(q3), a4 = avg(q4);

  // flawless: all fast
  if (a1 < 10000 && a2 < 10000 && a3 < 10000 && a4 < 10000) return 'Clean run.';
  // cold-start: slow first, fast finish
  if (a1 > a2 && a2 > a3 && a3 > a4 && a1 > 15000) return 'Slow start, strong finish.';
  // panic-recovery: V-shape (slow middle, fast ends)
  if (a2 > a1 && a2 > a3 && a3 < a2) return 'Clutch recovery.';
  // collapse: degrading
  if (a1 < a2 && a2 < a3 && a3 < a4) return 'Lost the thread.';
  // default
  return 'Solid effort.';
}

function updateTomorrowCountdown() {
  const now = new Date();
  const tomorrow = new Date(now);
  tomorrow.setUTCDate(tomorrow.getUTCDate() + 1);
  tomorrow.setUTCHours(0, 0, 0, 0);
  const diff = tomorrow - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  tomorrowCountdown.textContent = `Tomorrow's challenge in ${h}h ${m}m ${s}s`;
}

function persistStats(won) {
  const count = GAME_CONFIG.GRID_ROWS * GAME_CONFIG.GRID_COLS;
  STATS.tierPlays[count] = (STATS.tierPlays[count] || 0) + 1;
  if (won) {
    STATS.tierWins[count] = (STATS.tierWins[count] || 0) + 1;
  }
  // Rolling average moves
  const oldAvg = STATS.tierAvgMoves[count] || 0;
  const oldN = STATS.tierPlays[count] - 1;
  STATS.tierAvgMoves[count] = Math.round((oldAvg * oldN + S.moves) / STATS.tierPlays[count]);

  const today = getTodayUTC();
  STATS.lastDate = today;

  if (won) {
    STATS.streak = (STATS.streak || 0) + 1;
    STATS.maxStreak = Math.max(STATS.maxStreak || 0, STATS.streak);
  } else {
    STATS.streak = 0;
  }

  if (S.mode === 'daily') {
    STATS.dailyPlayed = today;
    STATS.dailyWon = won;
  }

  saveStats(STATS);
}

// ══════════════════════════════════════════════════════════════
//  SHARE MODULE
// ══════════════════════════════════════════════════════════════
const FLEX_THRESHOLD = 25; // show flex text when finishRate ≤ this

const SHARE_EMOJI = { cool: '🟦', clutch: '🟧', faded: '🟥' };

function _fmtShareTime(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function buildShareString(run) {
  const {
    puzzleNumber,
    mode,
    timeMs,
    streak,
    pairs,
    finishRate,
    baseUrl,
    percentile
  } = run;

  const modeSlug = mode.toLowerCase().replace(/\s+/g, '-');

  // Line 1
  const line1 = `FADE #${puzzleNumber} · ${mode} 💨`;

  // Line 2
  let line2 = `⏱ ${_fmtShareTime(timeMs)}  🔥${streak}`;
  if (finishRate <= FLEX_THRESHOLD) {
    line2 += `  · only ${finishRate}% clear this`;
  }
  if (percentile != null) {
    line2 += `  · top ${percentile}%`;
  }

  // Line 3 – fade trail (single line, spoiler-free)
  const line3 = pairs.map(p => SHARE_EMOJI[p] || '').join('');

  // Line 4
  const clutchCount = pairs.filter(p => p === 'clutch').length;
  const hasFaded = pairs.some(p => p === 'faded');
  let line4 = `⚡${clutchCount} clutch`;
  if (!hasFaded) {
    line4 += ' · ✨clean';
  }

  // Line 5
  const challengeUrl = `${baseUrl}#${puzzleNumber}-${modeSlug}`;
  const line5 = `👉 beat me: ${challengeUrl}`;

  return [line1, line2, line3, line4, line5].join('\n');
}

async function shareResult(run) {
  const text = buildShareString(run);

  const canNative = typeof navigator !== 'undefined'
    && navigator.share
    && (!navigator.canShare || navigator.canShare({ text }));

  if (canNative) {
    try {
      await navigator.share({ text });
      return 'shared';
    } catch (err) {
      // User cancelled or share failed — fall through
    }
  }

  // Clipboard fallback
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return 'copied';
    } catch (err) {
      // Non-secure context (HTTP) blocks Clipboard API — try execCommand
    }
  }

  // execCommand fallback for HTTP or very old browsers
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  return ok ? 'copied' : 'failed';
}

// ══════════════════════════════════════════════════════════════
//  SHARE ADAPTER (wires game state into the module above)
// ══════════════════════════════════════════════════════════════

const TIER_FINISH_RATES = { 12: 40, 16: 15, 20: 12, 24: 3 };
const TIER_NAMES = { 12: 'Warm-up', 16: 'Classic', 20: 'Hard', 24: 'Brutal' };

function getDailyNumber() {
  const epoch = new Date('2024-01-01T00:00:00Z');
  const today = new Date(getTodayUTC() + 'T00:00:00Z');
  return Math.floor((today - epoch) / 86400000) + 1;
}

function getGameBaseUrl() {
  // Works on GitHub Pages, localhost, or any static host
  const loc = window.location;
  return `${loc.origin}${loc.pathname}`;
}

async function shareScore() {
  const count = GAME_CONFIG.GRID_ROWS * GAME_CONFIG.GRID_COLS;
  const modeName = S.mode === 'daily' ? 'Daily' : (TIER_NAMES[count] || 'Classic');
  const finishRate = TIER_FINISH_RATES[count] || 15;

  const run = {
    puzzleNumber: getDailyNumber(),
    mode: modeName,
    timeMs: Math.round(S.elapsedTime * 1000),
    streak: (STATS.streak || 0),
    pairs: S.pairRecoveryTypes.slice(),
    finishRate,
    baseUrl: getGameBaseUrl(),
    percentile: computePercentile(S.score),
  };

  const result = await shareResult(run);
  if (result === 'copied' || result === 'failed') {
    showShareCopied();
  }
}

function showShareCopied() {
  shareBtn.innerHTML = 'Copied! 📋';
  shareBtn.classList.add('bg-emerald-800', 'border-emerald-700');
  shareBtn.classList.remove('bg-zinc-800', 'border-zinc-700/60');
  setTimeout(() => {
    shareBtn.innerHTML = '<span>📤</span> Share';
    shareBtn.classList.remove('bg-emerald-800', 'border-emerald-700');
    shareBtn.classList.add('bg-zinc-800', 'border-zinc-700/60');
  }, 1500);
}

// ══════════════════════════════════════════════════════════════
//  RESTART / NAVIGATION
// ══════════════════════════════════════════════════════════════
function playAgain() {
  stopTimer(); gameOverlay.classList.add("hidden");
  const hudCompact = document.getElementById("hudCompact");
  const hudFull = document.getElementById("hudFull");
  const timerBar = document.getElementById("timerBarTop");
  if (hudCompact) hudCompact.classList.remove("hidden");
  if (hudFull) hudFull.classList.remove("hidden");
  if (timerBar) timerBar.parentElement.classList.remove("hidden");
  if (victoryBanner) { victoryBanner.classList.remove("show"); victoryBanner.classList.add("hidden"); }
  S.score = 0; S.combo = 0; S.maxCombo = 0; S.moves = 0;
  S.flipHistory = []; S.pairTimes = []; S.pairRecoveryTypes = [];
  S.matchedPairs = 0; S.flippedIndices = [];
  S.isProcessing = false; S.gameActive = false;
  S.elapsedTime = 0; S.elapsedTimerId = null; S.firstFlipTime = 0;
  S.isBoardLocked = false; S.boardLockTimer = null;
  S.bombTriggered = false; S.clairvoyanceActive = false;
  underlayGrid.classList.remove("underlay-breathe", "underlay-victory");
  shareBtn.innerHTML = "<span>📤</span> Share";
  shareBtn.classList.remove("bg-emerald-800", "border-emerald-700");
  shareBtn.classList.add("bg-zinc-800", "border-zinc-700/60");
  updateScore(); updateComboDisplay(); initGame();
}

function backToMenu() {
  stopTimer();
  if (S.boardLockTimer) { clearTimeout(S.boardLockTimer); S.boardLockTimer = null; }
  S.isBoardLocked = false; gameEl.classList.remove("board-locked");
  gameOverlay.classList.add("hidden");
  const hudCompact = document.getElementById("hudCompact");
  const hudFull = document.getElementById("hudFull");
  const timerBar = document.getElementById("timerBarTop");
  if (hudCompact) hudCompact.classList.remove("hidden");
  if (hudFull) hudFull.classList.remove("hidden");
  if (timerBar) timerBar.parentElement.classList.remove("hidden");
  if (victoryBanner) { victoryBanner.classList.remove("show"); victoryBanner.classList.add("hidden"); }
  underlayGrid.classList.remove("underlay-breathe", "underlay-victory");
  showScreen("landing"); initLanding();
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
function initGame() {
  S.gameActive = false;
  S.elapsedTime = 0; S.elapsedTimerId = null; S.firstFlipTime = 0;
  S.isBoardLocked = false; S.boardLockTimer = null;
  S.bombTriggered = false; S.clairvoyanceActive = false;
  S.pairRecoveryTypes = [];
  underlayGrid.classList.remove("underlay-breathe", "underlay-victory");
  buildGrid(); updateScore(); updateComboDisplay(); updateElapsedDisplay();
  S.gameActive = true;
}

// ─── Handle resize/orientation change ───
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (S.gameActive) {
      const matchedEmojis = S.cards.filter(c => c.matched).map(c => c.emoji);
      buildGrid();
      // Restore matched state after resize rebuild
      S.cards.forEach(c => {
        if (matchedEmojis.includes(c.emoji)) {
          c.matched = true;
          c.flipped = true;
          c.element.classList.add('flipped', 'matched');
        }
      });
    }
  }, 200);
});

function getGridLayout(count) {
  // Portrait mobile: prefer fewer columns so grid is taller than wide
  let cols = Math.floor(Math.sqrt(count));
  cols = Math.max(3, cols);
  let rows = Math.ceil(count / cols);
  // If grid is wider than tall, reduce columns until it's portrait-friendly
  while (rows < cols && cols > 3) {
    cols--;
    rows = Math.ceil(count / cols);
  }
  return { cols, rows };
}

function getCardCount() {
  const saved = localStorage.getItem('fade_card_count');
  const count = saved ? parseInt(saved, 10) : 16;
  return [12, 16, 20, 24].includes(count) ? count : 16;
}

// ─── Button hooks ───
shareBtn.addEventListener('click', shareScore);
replayBtn.addEventListener('click', playAgain);
backBtn.addEventListener('click', backToMenu);

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') playAgain();
  if (e.key === 'Escape') backToMenu();
});

// ─── Go! ───
initLanding();
</script>

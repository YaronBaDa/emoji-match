<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>Emoji Match</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ─── Base Reset ─── */
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100dvh; overflow: hidden; margin: 0; padding: 0;
      background: #030712; color: #f1f5f9;
      font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ─── Card Flip 3D ─── */
    .card { perspective: 800px; cursor: pointer; }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 2rem; will-change: transform;
    }
    .card-back {
      background: linear-gradient(145deg,#1e1b4b,#312e81);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 4px 12px rgba(0,0,0,0.4);
    }
    .card-back::after {
      content: '?'; font-size: 1.6rem; font-weight: 800;
      color: rgba(255,255,255,0.15); line-height: 1;
    }
    .card-front {
      transform: rotateY(180deg);
      background: linear-gradient(145deg,#1e293b,#0f172a);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.4);
    }
    .card.matched .card-front {
      box-shadow: 0 0 20px rgba(34,197,94,0.35), inset 0 0 0 1px rgba(34,197,94,0.3);
    }
    .card.matched { pointer-events: none; }
    .card.mismatch .card-inner { animation: shake 0.15s ease; }

    /* ─── Animations ─── */
    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-6px); }
      40% { transform: rotateY(180deg) translateX(6px); }
      60% { transform: rotateY(180deg) translateX(-4px); }
      80% { transform: rotateY(180deg) translateX(4px); }
    }
    @keyframes matchPop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.18); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    .card.matched .card-inner { animation: matchPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      30% { opacity: 1; transform: translateY(-8px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }
    .combo-float {
      position: fixed; pointer-events: none; z-index: 200;
      font-size: 1.3rem; font-weight: 800;
      color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.6), 0 2px 8px rgba(0,0,0,0.5);
      animation: floatUp 0.5s ease-out forwards;
    }
    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 8px rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 24px rgba(239,68,68,0.8); }
    }
    .timer-critical { animation: pulseGlow 0.8s ease-in-out infinite; }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translate(-50%,10px) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%,0) scale(1); }
    }
    .level-up-toast { animation: fadeInUp 0.4s ease-out forwards; }
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.5); }
      60% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .overlay-content { animation: bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pulseBtn {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99,102,241,0.5); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 12px rgba(99,102,241,0); }
    }
    .btn-pulse { animation: pulseBtn 1.8s ease-in-out infinite; }
    @keyframes slideDown {
      0% { width: 100%; }
    }
    .timer-start { animation: slideDown 0s; }

    /* ─── Scrollbar hide ─── */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ─── Grid fade-in ─── */
    .grid-fade-in { animation: gridFadeIn 0.3s ease-out; }
    @keyframes gridFadeIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ─── Responsive emoji sizing ─── */
    @media (max-width:380px) {
      .card-face { font-size: 1.5rem; border-radius: 10px; }
      .card-back::after { font-size: 1.2rem; }
    }
    @media (min-width:500px) {
      .card-face { font-size: 2.4rem; }
      .card-back::after { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div id="game" class="h-full w-full flex flex-col overflow-hidden">

  <!-- ═══ Timer Bar ═══ -->
  <div class="flex-shrink-0 px-3 pt-2.5 pb-1">
    <div class="w-full h-[5px] bg-gray-800/60 rounded-full overflow-hidden">
      <div id="timerBar" class="h-full rounded-full transition-all duration-150 ease-linear" style="width:100%;background:#22c55e"></div>
    </div>
  </div>

  <!-- ═══ Stats Bar ═══ -->
  <div class="flex-shrink-0 flex items-center justify-between px-4 py-1.5 text-xs sm:text-sm">
    <div class="flex items-center gap-1.5">
      <span class="text-base">🏆</span>
      <span id="scoreDisplay" class="font-bold text-white tabular-nums">0</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="comboDisplay" class="hidden items-center gap-1 text-amber-400 font-bold">
        <span>🔥</span><span id="comboCount">x0</span>
      </span>
      <span class="text-gray-400 font-medium">Lv <span id="levelDisplay">1</span></span>
    </div>
  </div>

  <!-- ═══ Grid ═══ -->
  <div id="gridWrapper" class="flex-1 flex items-center justify-center px-3 pb-3 overflow-hidden">
    <div id="grid" class="grid grid-fade-in"></div>
  </div>

  <!-- ═══ Floating Text Container ═══ -->
  <div id="floatingContainer" class="fixed inset-0 pointer-events-none z-30"></div>

  <!-- ═══ Level Up Toast ═══ -->
  <div id="levelUpToast" class="fixed top-[60px] left-1/2 -translate-x-1/2 z-40 pointer-events-none hidden">
    <div class="bg-indigo-600/90 backdrop-blur-sm text-white font-bold px-5 py-2 rounded-xl shadow-xl text-sm level-up-toast whitespace-nowrap">
      ⬆ Level <span id="toastLevelNum">2</span>
    </div>
  </div>

  <!-- ═══ Game Over Overlay ═══ -->
  <div id="gameOverOverlay" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center p-6">
    <div class="overlay-content flex flex-col items-center gap-4 w-full max-w-xs text-center">
      <!-- Header -->
      <div id="overlayHeader" class="text-4xl mb-1">💀</div>
      <div id="overlayTitle" class="text-2xl font-extrabold tracking-tight text-white">Game Over</div>

      <!-- Score -->
      <div class="mt-2 text-center">
        <div class="text-5xl font-black tabular-nums text-white"><span id="finalScore">0</span></div>
        <div class="text-xs text-gray-400 uppercase tracking-widest mt-0.5">Score</div>
      </div>

      <!-- Stats row -->
      <div class="flex items-center gap-6 mt-1 text-sm">
        <div class="text-center">
          <div class="text-lg font-bold text-orange-400"><span id="finalCombo">0</span>x</div>
          <div class="text-[10px] text-gray-500 uppercase tracking-wider">Best Combo</div>
        </div>
        <div class="text-center">
          <div class="text-lg font-bold text-sky-400"><span id="finalLevel">1</span></div>
          <div class="text-[10px] text-gray-500 uppercase tracking-wider">Level</div>
        </div>
      </div>

      <!-- Rank -->
      <div class="mt-1 bg-white/5 rounded-2xl px-5 py-2.5 border border-white/10 w-full">
        <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-0.5">Rank</div>
        <div id="rankDisplay" class="text-lg font-bold text-amber-400">—</div>
      </div>

      <!-- Share -->
      <button id="shareBtn" class="w-full mt-1 flex items-center justify-center gap-2 bg-white/10 hover:bg-white/15 active:bg-white/20 rounded-2xl px-5 py-3 text-sm font-semibold transition-colors border border-white/10">
        <span>📤</span> <span>Brag &amp; Share</span>
      </button>
      <div id="shareToast" class="hidden text-[11px] text-emerald-400 font-medium transition-opacity">✓ Copied to clipboard!</div>

      <!-- Play Again -->
      <button id="replayBtn" class="btn-pulse w-full mt-1 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 rounded-2xl px-5 py-3.5 text-sm font-bold text-white transition-colors shadow-lg shadow-indigo-600/30">
        🔄 Play Again
      </button>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIGURATION
// ══════════════════════════════════════════════════════════════
const LEVELS = [
  { cols: 3, rows: 4, pairs: 6,  time: 42 },  // 12 cards
  { cols: 4, rows: 4, pairs: 8,  time: 35 },  // 16 cards
  { cols: 4, rows: 5, pairs: 10, time: 28 },  // 20 cards
];

const ALL_EMOJIS = [
  '🔥','💎','🌈','🦄','🚀','🎯','⚡','💫',
  '🎪','🍕','🦋','🐲','🎨','🍭','🧩','🛸',
  '🥑','🌮','🍄','🐙','🦩','🌺','🎸','🍀',
  '🧲','🎰','🪄','🦚','🥷','🧊'
];

const RANKS = [
  { min: 0,     title: '🐠 Goldfish Memory' },
  { min: 400,   title: '👤 Average Human' },
  { min: 1500,  title: '📜 Meme Scholar' },
  { min: 3500,  title: '🧠 Gigabrain' },
  { min: 6000,  title: '👑 Emoji Deity' },
];

const GAME_URL = 'https://yaronbada.github.io/emoji-match/';
const BASE_SCORE = 100;
const COMBO_WINDOW = 2000; // ms
const MATCH_TIME_BONUS = 2; // seconds
const GRID_GAP = 8;
const TIMER_INTERVAL = 100; // ms

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
const S = {
  level: 0,
  score: 0,
  combo: 0,
  maxCombo: 0,
  timeLeft: 45,
  maxTime: 45,
  totalPairs: 6,
  matchedPairs: 0,
  flippedIndices: [],
  cards: [],          // { emoji, matched, flipped, element }
  isProcessing: false,
  lastMatchTime: 0,
  timerId: null,
  gameActive: false,
};

// ══════════════════════════════════════════════════════════════
//  DOM REFS
// ══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

const gridEl        = $('grid');
const gridWrapper   = $('gridWrapper');
const timerBar      = $('timerBar');
const scoreDisplay  = $('scoreDisplay');
const comboDisplay  = $('comboDisplay');
const comboCount    = $('comboCount');
const levelDisplay  = $('levelDisplay');
const floatContainer= $('floatingContainer');
const levelUpToast  = $('levelUpToast');
const toastLevelNum = $('toastLevelNum');
const gameOverlay   = $('gameOverOverlay');
const overlayHeader = $('overlayHeader');
const overlayTitle  = $('overlayTitle');
const finalScore    = $('finalScore');
const finalCombo    = $('finalCombo');
const finalLevel    = $('finalLevel');
const rankDisplay   = $('rankDisplay');
const shareBtn      = $('shareBtn');
const shareToast    = $('shareToast');
const replayBtn     = $('replayBtn');

// ══════════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getEmojisForLevel(count) {
  return shuffle([...ALL_EMOJIS]).slice(0, count);
}

function getRank(score) {
  let rank = RANKS[0];
  for (const r of RANKS) {
    if (score >= r.min) rank = r;
  }
  return rank;
}

function getRankShort(score) {
  const full = getRank(score).title;
  const parts = full.split(' ');
  parts.shift(); // remove emoji
  return parts.join(' ').toUpperCase();
}

// ══════════════════════════════════════════════════════════════
//  GRID
// ══════════════════════════════════════════════════════════════
function calculateCardSize() {
  const gap = GRID_GAP;
  const { cols, rows } = LEVELS[S.level];
  const wrapper = gridWrapper;
  const pad = 12; // px-3 * 2
  const availW = wrapper.clientWidth - pad;
  const availH = wrapper.clientHeight - pad;
  const maxByW = (availW - (cols - 1) * gap) / cols;
  const maxByH = (availH - (rows - 1) * gap) / rows;
  return Math.max(40, Math.min(maxByW, maxByH));
}

function buildGrid() {
  const lvl = LEVELS[S.level];
  const { cols, rows } = lvl;
  S.totalPairs = lvl.pairs;
  S.matchedPairs = 0;
  S.cards = [];

  const emojis = getEmojisForLevel(lvl.pairs);
  const pairs = [...emojis, ...emojis]; // duplicate for pairs
  shuffle(pairs);

  const size = calculateCardSize();

  gridEl.style.display = 'grid';
  gridEl.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
  gridEl.style.gridTemplateRows = `repeat(${rows}, ${size}px)`;
  gridEl.style.gap = `${GRID_GAP}px`;
  gridEl.style.justifyContent = 'center';
  gridEl.style.alignContent = 'center';

  // Fade in
  gridEl.classList.remove('grid-fade-in');
  void gridEl.offsetWidth; // force reflow
  gridEl.classList.add('grid-fade-in');

  gridEl.innerHTML = '';
  S.flippedIndices = [];

  pairs.forEach((emoji, idx) => {
    const cardWrapper = document.createElement('div');
    cardWrapper.className = 'card';
    cardWrapper.dataset.index = idx;
    cardWrapper.style.width = `${size}px`;
    cardWrapper.style.height = `${size}px`;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    front.textContent = emoji;

    inner.appendChild(back);
    inner.appendChild(front);
    cardWrapper.appendChild(inner);

    cardWrapper.addEventListener('click', () => onCardClick(idx));
    cardWrapper.addEventListener('touchstart', (e) => {
      // Prevent double-tap zoom on iOS
      e.preventDefault();
      onCardClick(idx);
    }, { passive: false });

    gridEl.appendChild(cardWrapper);

    S.cards.push({
      emoji,
      matched: false,
      flipped: false,
      element: cardWrapper,
      index: idx,
    });
  });
}

function getCardEl(index) {
  return S.cards[index]?.element;
}

// ══════════════════════════════════════════════════════════════
//  CARD LOGIC
// ══════════════════════════════════════════════════════════════
function onCardClick(index) {
  if (!S.gameActive) return;
  if (S.isProcessing) return;

  const card = S.cards[index];
  if (!card || card.matched || card.flipped) return;
  if (S.flippedIndices.includes(index)) return;

  // Flip
  card.flipped = true;
  card.element.classList.add('flipped');
  S.flippedIndices.push(index);

  if (S.flippedIndices.length === 2) {
    S.isProcessing = true;
    setTimeout(checkMatch, 400);
  }
}

function checkMatch() {
  const [i1, i2] = S.flippedIndices;
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  if (c1.emoji === c2.emoji) {
    handleMatch(i1, i2);
  } else {
    handleMismatch(i1, i2);
  }
}

function handleMatch(i1, i2) {
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  c1.matched = true;
  c2.matched = true;
  c1.element.classList.add('matched');
  c2.element.classList.add('matched');

  S.matchedPairs++;

  // Combo
  const now = performance.now();
  if (S.lastMatchTime && (now - S.lastMatchTime < COMBO_WINDOW)) {
    S.combo++;
  } else {
    S.combo = 0;
  }
  S.lastMatchTime = now;

  if (S.combo > S.maxCombo) S.maxCombo = S.combo;

  // Score
  const multiplier = S.combo + 1; // combo 0 = 1x, combo 1 = 2x, etc.
  const points = BASE_SCORE * multiplier;
  S.score += points;

  // Time bonus
  addTime(MATCH_TIME_BONUS);

  // Floating text for every match
  const midX = (c1.element.getBoundingClientRect().left + c2.element.getBoundingClientRect().right) / 2;
  const midY = Math.min(c1.element.getBoundingClientRect().top, c2.element.getBoundingClientRect().top) - 20;
  const label = S.combo >= 1 ? `+${points} Combo x${multiplier}!` : `+${points}`;
  showFloatingText(label, midX, midY);

  // Update UI
  updateScore();
  updateComboDisplay();

  // Check level
  if (S.matchedPairs >= S.totalPairs) {
    if (S.level < LEVELS.length - 1) {
      setTimeout(nextLevel, 700);
    } else {
      setTimeout(victory, 700);
    }
    // Don't unlock — blocked by level transition
    S.flippedIndices = [];
    return;
  }

  S.flippedIndices = [];
  S.isProcessing = false;
}

function handleMismatch(i1, i2) {
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];
  const el1 = c1.element;
  const el2 = c2.element;

  el1.classList.add('mismatch');
  el2.classList.add('mismatch');

  S.combo = 0;
  updateComboDisplay();

  setTimeout(() => {
    el1.classList.remove('flipped','mismatch');
    el2.classList.remove('flipped','mismatch');
    c1.flipped = false;
    c2.flipped = false;
    S.flippedIndices = [];
    S.isProcessing = false;
  }, 500);
}

// ══════════════════════════════════════════════════════════════
//  FLOATING TEXT
// ══════════════════════════════════════════════════════════════
function showFloatingText(text, x, y) {
  const el = document.createElement('div');
  el.className = 'combo-float';
  el.textContent = text;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.style.transform = 'translate(-50%,-50%)';
  floatContainer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

// ══════════════════════════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════════════════════════
function startTimer() {
  stopTimer();
  S.timeLeft = LEVELS[S.level].time;
  S.maxTime = S.timeLeft;
  updateTimerBar();
  S.timerId = setInterval(() => {
    S.timeLeft -= TIMER_INTERVAL / 1000;
    if (S.timeLeft <= 0) {
      S.timeLeft = 0;
      updateTimerBar();
      gameOver();
    } else {
      updateTimerBar();
    }
  }, TIMER_INTERVAL);
}

function stopTimer() {
  if (S.timerId) {
    clearInterval(S.timerId);
    S.timerId = null;
  }
}

function addTime(sec) {
  S.timeLeft += sec;
  S.timeLeft = Math.min(S.timeLeft, S.maxTime + 5); // soft cap
  updateTimerBar();
}

function updateTimerBar() {
  const pct = Math.max(0, (S.timeLeft / S.maxTime) * 100);
  timerBar.style.width = `${pct}%`;

  let color;
  let critical = false;
  if (pct > 50) {
    color = '#22c55e'; // green
  } else if (pct > 25) {
    color = '#eab308'; // yellow
  } else if (pct > 10) {
    color = '#ef4444'; // red
  } else {
    color = '#ef4444';
    critical = true;
  }
  timerBar.style.background = color;
  timerBar.classList.toggle('timer-critical', critical && S.gameActive);
}

// ══════════════════════════════════════════════════════════════
//  UI UPDATES
// ══════════════════════════════════════════════════════════════
function updateScore() {
  scoreDisplay.textContent = S.score;
}

function updateComboDisplay() {
  if (S.combo > 0) {
    comboDisplay.classList.remove('hidden');
    comboCount.textContent = `x${S.combo + 1}`;
  } else {
    comboDisplay.classList.add('hidden');
  }
}

function updateLevelDisplay() {
  levelDisplay.textContent = S.level + 1;
}

// ══════════════════════════════════════════════════════════════
//  LEVELS
// ══════════════════════════════════════════════════════════════
function nextLevel() {
  S.level++;
  S.flippedIndices = [];
  S.isProcessing = false;

  // Show toast
  toastLevelNum.textContent = S.level + 1;
  levelUpToast.classList.remove('hidden');
  setTimeout(() => levelUpToast.classList.add('hidden'), 1200);

  buildGrid();
  updateLevelDisplay();

  // Grid size may have changed; recalculate
  // Timer continues uninterrupted
}

function showLevelUpToast(level) {
  // handled in nextLevel
}

// ══════════════════════════════════════════════════════════════
//  GAME OVER / VICTORY
// ══════════════════════════════════════════════════════════════
function gameOver() {
  S.gameActive = false;
  stopTimer();
  showOverlay('💀', 'Game Over');
}

function victory() {
  S.gameActive = false;
  stopTimer();
  showOverlay('🏆', 'Victory!');
}

function showOverlay(headerEmoji, titleText) {
  overlayHeader.textContent = headerEmoji;
  overlayTitle.textContent = titleText;
  finalScore.textContent = S.score;
  finalCombo.textContent = S.maxCombo + 1;
  finalLevel.textContent = S.level + 1;
  rankDisplay.textContent = getRank(S.score).title;

  // Reset share toast
  shareToast.classList.add('hidden');

  gameOverlay.classList.remove('hidden');
}

// ══════════════════════════════════════════════════════════════
//  SHARE
// ══════════════════════════════════════════════════════════════
function shareScore() {
  const rankFull = getRank(S.score).title;
  const text = [
    `🧠 EMOJI MATCH 🧠`,
    `🏆 Score: ${S.score}`,
    `🔥 Max Combo: ${S.maxCombo + 1}`,
    `👑 Rank: ${rankFull}`,
    `🕹️ Level Reached: ${S.level + 1}`,
    `Can you beat my brain? ⚡ ${GAME_URL}`,
  ].join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showShareCopied();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showShareCopied();
  } catch (e) {
    alert('Tap to copy:\n\n' + text);
  }
  document.body.removeChild(ta);
}

function showShareCopied() {
  shareToast.classList.remove('hidden');
  setTimeout(() => shareToast.classList.add('hidden'), 2500);
}

// ══════════════════════════════════════════════════════════════
//  RESTART
// ══════════════════════════════════════════════════════════════
function playAgain() {
  stopTimer();
  gameOverlay.classList.add('hidden');
  levelUpToast.classList.add('hidden');

  S.level = 0;
  S.score = 0;
  S.combo = 0;
  S.maxCombo = 0;
  S.matchedPairs = 0;
  S.flippedIndices = [];
  S.isProcessing = false;
  S.gameActive = false;

  updateScore();
  updateComboDisplay();
  initGame();
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
function initGame() {
  S.gameActive = false;

  buildGrid();
  updateLevelDisplay();
  updateScore();
  updateComboDisplay();

  // Small delay before starting timer so player sees the grid
  S.gameActive = true;
  startTimer();
}

// ─── Handle resize/orientation change ───
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (S.gameActive) {
      // Rebuild grid with new sizes (preserve state)
      // Save card match states
      const matchedEmojis = S.cards.filter(c => c.matched).map(c => c.emoji);
      buildGrid();
      // Re-flip matched cards
      S.cards.forEach(c => {
        if (matchedEmojis.includes(c.emoji)) {
          c.matched = true;
          c.flipped = true;
          c.element.classList.add('flipped', 'matched');
        }
      });
    }
  }, 200);
});

// ─── Button hooks ───
shareBtn.addEventListener('click', shareScore);
replayBtn.addEventListener('click', playAgain);

// ─── Keyboard shortcut for replay during development ───
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') playAgain();
});

// ─── Go! ───
initGame();
</script>

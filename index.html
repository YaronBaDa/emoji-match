<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>FADE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100dvh; overflow: hidden; margin: 0; padding: 0;
      background: #09090b;
      color: #f4f4f5;
      font-family: 'Unbounded', sans-serif;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ─── Screens ─── */
    .screen { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
    .screen.active { display: flex; }

    /* ─── Dot-Matrix Background ─── */
    #gameScreen.dot-bg::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
      z-index: 0;
    }
    #gameScreen.dot-bg > * { position: relative; z-index: 1; }
    #gameScreen.dot-bg #floatingContainer { z-index: 30; }
    #gameScreen.dot-bg #gameOverOverlay { z-index: 50; }

    /* ─── Landing ─── */
    #landingScreen { background: #09090b; }
    .landing-hero {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 8px;
    }
    .hero-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 160px;
      margin-bottom: 10px;
    }
    .hero-card {
      aspect-ratio: 1;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      transform-style: preserve-3d;
    }
    .hero-card.flipped { background: #18181b; border-color: rgba(255,255,255,0.12); }
    .hero-card.matched { opacity: 0; transform: scale(0.9); }
    .hero-card.faded { filter: grayscale(1) opacity(0.35); border-color: #3f3f46; }

    .landing-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.06em;
      color: #f4f4f5;
      text-align: center;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 0 30px rgba(34,211,238,0.15);
    }
    .landing-tagline {
      font-size: 12px;
      color: #a1a1aa;
      text-align: center;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .landing-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 16px 16px;
    }

    /* ─── Daily Card ─── */
    .daily-card {
      background: linear-gradient(135deg, rgba(34,211,238,0.08) 0%, rgba(34,211,238,0.02) 100%);
      border: 1px solid rgba(34,211,238,0.25);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .daily-card:hover { border-color: rgba(34,211,238,0.5); }
    .daily-card:active { transform: scale(0.98); }
    .daily-card.locked {
      background: rgba(39,39,42,0.4);
      border-color: #27272a;
      cursor: default;
    }
    .daily-card.locked:hover { border-color: #27272a; }
    .daily-card.locked:active { transform: none; }
    .daily-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #22d3ee;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .daily-date { font-size: 13px; font-weight: 700; color: #f4f4f5; }
    .daily-streak { font-size: 11px; color: #fbbf24; margin-top: 3px; }
    .daily-countdown { font-size: 10px; color: #a1a1aa; margin-top: 3px; font-family: 'Space Mono', monospace; }

    /* ─── Tier Buttons ─── */
    .tier-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tier-btn {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px 10px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .tier-btn:hover { border-color: #3f3f46; background: #1c1c1f; }
    .tier-btn:active { transform: scale(0.97); }
    .tier-name {
      font-size: 12px;
      font-weight: 700;
      color: #f4f4f5;
      margin-bottom: 2px;
    }
    .tier-count {
      font-size: 10px;
      color: #a1a1aa;
      font-family: 'Space Mono', monospace;
    }
    .tier-stat {
      font-size: 9px;
      color: #71717a;
      margin-top: 4px;
      font-family: 'Space Mono', monospace;
    }

    /* ─── Card Flip 3D ─── */
    .card { perspective: 800px; cursor: pointer; }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      will-change: transform;
    }
    .card-front {
      transform: rotateY(180deg);
      background: #18181b;
      border: 1px solid #27272a;
    }
    .card-back {
      background: #18181b;
      border: 1px solid #27272a;
    }
    .card-back::after {
      content: '';
      display: block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .card.matched .card-front {
      border-color: rgba(34,197,94,0.25);
    }
    .card.matched { pointer-events: none; }
    .card.mismatch .card-inner { animation: shake 0.15s ease; }
    .card.flipped .card-front {
      border-color: rgba(255,255,255,0.12);
    }

    /* ─── Visual Fade Decay on Cards ─── */
    .card-face {
      transition: filter 1.2s ease, opacity 1.2s ease, border-color 1.2s ease;
    }
    .card.faded-1 .card-face { filter: saturate(0.65); border-color: rgba(255,255,255,0.06); }
    .card.faded-2 .card-face { filter: saturate(0.35) grayscale(0.4); border-color: rgba(255,255,255,0.04); opacity: 0.85; }
    .card.faded-3 .card-face { filter: saturate(0.15) grayscale(0.7); border-color: rgba(255,255,255,0.03); opacity: 0.60; }
    .card.faded-4 .card-face { filter: saturate(0) grayscale(1); border-color: rgba(255,255,255,0.02); opacity: 0.30; }
    .card.faded-5 .card-face { filter: saturate(0) grayscale(1); border-color: transparent; opacity: 0; }

    /* ─── Animations ─── */
    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-6px); }
      40% { transform: rotateY(180deg) translateX(6px); }
      60% { transform: rotateY(180deg) translateX(-4px); }
      80% { transform: rotateY(180deg) translateX(4px); }
    }
    @keyframes matchPop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.18); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    .card.matched .card-inner { animation: matchPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      30% { opacity: 1; transform: translateY(-8px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }
    .combo-float {
      position: fixed; pointer-events: none; z-index: 200;
      font-size: 1rem; font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.5);
      animation: floatUp 0.5s ease-out forwards;
    }

    @keyframes comboPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); color: #fff; text-shadow: 0 0 16px rgba(251,191,36,0.8); }
      100% { transform: scale(1); }
    }
    .combo-pulse { animation: comboPulse 0.35s cubic-bezier(0.34,1.56,0.64,1); }

    @keyframes confettiBurst {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(540deg) scale(0.2); }
    }
    .confetti-piece {
      position: fixed; pointer-events: none; z-index: 200;
      border-radius: 2px;
      animation: confettiBurst 0.7s ease-out forwards;
    }

    @keyframes adrenalinePulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    #gameScreen.adrenaline-mode::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(220,38,38,0.18) 100%);
      pointer-events: none;
      z-index: 15;
      animation: adrenalinePulse 1s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 6px rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 16px rgba(239,68,68,0.6); }
    }
    .timer-critical { animation: pulseGlow 0.8s ease-in-out infinite; }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.5); }
      60% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .overlay-content { animation: bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pulseBtn {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.1); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    }
    .btn-pulse { animation: pulseBtn 1.8s ease-in-out infinite; }

    .grid-fade-in { animation: gridFadeIn 0.3s ease-out; }
    @keyframes gridFadeIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ─── Tempo Map ─── */
    .tempo-map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
    .tempo-cell {
      aspect-ratio: 1;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }
    .tempo-fast { background: rgba(34,197,94,0.35); color: #4ade80; }
    .tempo-med  { background: rgba(251,191,36,0.35); color: #fbbf24; }
    .tempo-slow { background: rgba(239,68,68,0.35); color: #f87171; }
    .tempo-empty { background: rgba(39,39,42,0.5); color: #52525b; }

    /* ─── Feature Flags ─── */
    .compact-mode #hudFull { display: none; }
    #gameScreen:not(.compact-mode) #hudCompact { display: none; }
    .vanish-mode .card.matched {
      opacity: 0 !important;
      transition: opacity 0.4s ease !important;
      pointer-events: none !important;
    }
    .vanish-mode .card.matched .card-front {
      border-color: transparent !important;
    }

    @media (max-width:380px) {
      .card-face { border-radius: 4px; }
      .card-back::after { width: 4px; height: 4px; }
      .hero-board { width: 140px; gap: 6px; }
      .hero-card { font-size: 18px; border-radius: 4px; }
    }
    @media (min-width:500px) {
      .card-back::after { width: 8px; height: 8px; }
    }

    /* ─── Underlay Image Reveal ─── */
    #underlayGrid {
      position: absolute;
      display: grid;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
    }
    .underlay-cell {
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      transition: opacity 0.5s ease;
    }
    .card.matched.reveal-underlay {
      opacity: 0 !important;
      transition: opacity 0.6s ease !important;
      pointer-events: none !important;
    }

    /* ─── Golden Pair Glow ─── */
    @keyframes goldenPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.35); }
      50% { box-shadow: 0 0 14px 3px rgba(251,191,36,0.45); }
    }
    .golden-pair .card-inner {
      animation: goldenPulse 1.4s ease-in-out infinite;
      border-radius: 6px;
    }
    .golden-pair .card-front {
      border-color: rgba(251,191,36,0.6) !important;
    }

    /* ─── Mimic Trap Flash ─── */
    @keyframes mimicFlash {
      0%,100% { border-color: rgba(239,68,68,0.25); }
      50% { border-color: rgba(239,68,68,0.9); box-shadow: 0 0 10px rgba(239,68,68,0.4); }
    }
    .mimic-trap .card-inner {
      animation: mimicFlash 0.7s ease-in-out infinite;
    }
    .mimic-trap .card-front {
      border-color: rgba(239,68,68,0.5) !important;
    }

    /* ─── Screen Shake ─── */
    @keyframes screenShake {
      0%,100% { transform: translate(0,0); }
      10% { transform: translate(-10px,-5px); }
      20% { transform: translate(10px,5px); }
      30% { transform: translate(-8px,8px); }
      40% { transform: translate(8px,-8px); }
      50% { transform: translate(-5px,-5px); }
      60% { transform: translate(5px,5px); }
      70% { transform: translate(-3px,3px); }
      80% { transform: translate(3px,-3px); }
    }
    .screen-shake {
      animation: screenShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* ─── X-Ray Auto Flash Overlay ─── */
    @keyframes xrayFlashOverlay {
      0% { opacity: 0; }
      8% { opacity: 1; background: radial-gradient(circle at center, rgba(34,211,238,0.18) 0%, transparent 65%); }
      92% { opacity: 1; background: radial-gradient(circle at center, rgba(34,211,238,0.18) 0%, transparent 65%); }
      100% { opacity: 0; }
    }
    .xray-flash-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 25;
      animation: xrayFlashOverlay 0.6s ease-out forwards;
    }

    /* ─── Board Lock (Mimic Penalty) ─── */
    .board-locked::after {
      content: '';
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0,0,0,0.22);
      pointer-events: all;
    }
    .board-lock-timer {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 41; font-size: 13px; font-weight: 800; color: #ef4444;
      font-family: 'Space Mono', monospace; pointer-events: none;
      letter-spacing: 0.05em;
      text-shadow: 0 0 12px rgba(239,68,68,0.5);
    }
    /* Hide matched cards with underlay reveal instead of vanish */
    .reveal-mode .card.matched {
      opacity: 0;
      transition: opacity 0.5s ease 0.15s;
      pointer-events: none;
    }

  </style>
</head>
<body>

<!-- ═══ LANDING SCREEN ═══ -->
<div id="landingScreen" class="screen active">
  <div class="landing-hero">
    <div class="landing-title">FADE</div>
    <div class="hero-board" id="heroBoard"></div>
    <div class="landing-tagline">Match them before they fade.</div>
  </div>

  <div class="landing-scroll">
    <!-- Daily Challenge -->
    <div id="dailyCard" class="daily-card">
      <div class="daily-label">Daily Challenge</div>
      <div class="daily-date" id="dailyDate">—</div>
      <div class="daily-streak" id="dailyStreak">🔥 Day 0</div>
      <div class="daily-countdown hidden" id="dailyCountdown">Tomorrow in —</div>
    </div>

    <!-- Tier Buttons -->
    <div class="tier-grid">
      <button class="tier-btn" data-count="12" onclick="startGameFromTier(12)">
        <div class="tier-name">Warm-up</div>
        <div class="tier-count">12 cards</div>
        <div class="tier-stat" id="tierStat12">avg 0:42 · — finish</div>
      </button>
      <button class="tier-btn" data-count="16" onclick="startGameFromTier(16)">
        <div class="tier-name">Classic</div>
        <div class="tier-count">16 cards</div>
        <div class="tier-stat" id="tierStat16">avg 1:30 · — finish</div>
      </button>
      <button class="tier-btn" data-count="20" onclick="startGameFromTier(20)">
        <div class="tier-name">Hard</div>
        <div class="tier-count">20 cards</div>
        <div class="tier-stat" id="tierStat20">12% finish</div>
      </button>
      <button class="tier-btn" data-count="24" onclick="startGameFromTier(24)">
        <div class="tier-name">Brutal</div>
        <div class="tier-count">24 cards</div>
        <div class="tier-stat" id="tierStat24">3% finish</div>
      </button>
    </div>
  </div>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div id="gameScreen" class="screen">

  <!-- Timer Bar -->
  <div class="flex-shrink-0 w-full" style="height:3px;">
    <div id="timerBarTop" class="h-full transition-all duration-150 ease-linear" style="width:100%;background:#22d3ee"></div>
  </div>

  <!-- Bento Box HUD -->
  <div id="hudCompact" class="flex-shrink-0 mx-3 mt-3">
    <div class="grid grid-cols-5 gap-1.5">
      <div class="col-span-2 bg-zinc-900/30 border border-zinc-800/80 rounded-md p-2.5 flex items-center justify-center">
        <span class="font-black tracking-tighter text-4xl text-zinc-100 leading-none">FADE</span>
      </div>
      <div class="col-span-3 bg-zinc-900/30 border border-zinc-800/80 rounded-md px-2.5 py-2 flex items-center justify-between">
        <div class="flex items-center gap-1.5 font-mono text-[11px]">
          <span class="text-base leading-none">🏆</span>
          <span id="scoreDisplayCompact" class="font-bold text-zinc-100">0</span>
          <span class="text-zinc-700">/</span>
          <span class="text-[10px] text-zinc-500">🕹️</span>
          <span id="movesDisplayCompact" class="font-bold text-zinc-100">0</span>
        </div>
        <span id="comboDisplayCompact" class="hidden items-center gap-1 text-amber-400 font-bold font-mono text-xs">
          <span>🔥</span><span id="comboCountCompact">x0</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Full Header (fallback) -->
  <div id="hudFull" class="flex-shrink-0 px-4 pt-3 pb-2">
    <span class="font-black tracking-tighter text-4xl text-zinc-100">FADE</span>
    <div class="flex items-center justify-between mt-1 font-mono text-xs">
      <div class="flex items-center gap-2">
        <span>🏆</span>
        <span id="scoreDisplay" class="font-bold text-zinc-100">0</span>
        <span class="text-zinc-600">/</span>
        <span class="text-zinc-500">🕹️</span>
        <span id="movesDisplay" class="font-bold text-zinc-100">0</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="comboDisplay" class="hidden items-center gap-1 text-amber-400 font-bold">🔥<span id="comboCount">x0</span></span>
        <span id="xrayHud" class="text-zinc-500 text-[10px] font-mono">👁️×0</span>
      </div>
    </div>
  </div>

  <!-- Grid -->
  <div id="gridWrapper" class="flex-1 min-h-0 flex items-center justify-center px-3 pb-1 overflow-hidden" style="max-height:66vh">
  <div id="underlayGrid"></div>
    <div id="grid" class="grid grid-cols-4 gap-1.5 grid-fade-in"></div>
  </div>

  <!-- X-Ray -->
  <div id="xrayContainer" class="flex-shrink-0 pb-1.5 px-3 flex justify-center">
    <div class="bg-zinc-900/30 border border-zinc-800/80 rounded-md px-3 py-2 flex items-center gap-2">
      <button id="xrayBtn" class="font-mono font-bold text-[10px] text-zinc-100 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 rounded-sm px-3 py-1.5 transition-colors border border-zinc-700/60">
        👁️ X-RAY
      </button>
      <span id="xrayLabel" class="font-mono text-[9px] text-zinc-600">peek</span>
    </div>
  </div>

  <!-- Floating Text Container -->
  <div id="floatingContainer" class="fixed inset-0 pointer-events-none z-30"></div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 overflow-y-auto">
    <div class="overlay-content flex flex-col items-center gap-3 w-full max-w-xs text-center bg-zinc-900/70 backdrop-blur-xl border border-zinc-800/80 shadow-2xl rounded-md px-6 py-7 max-h-[85dvh] overflow-y-auto">
      <div id="overlayHeader" class="text-3xl mb-1">💀</div>
      <div id="overlayTitle" class="text-xl font-black tracking-tight text-zinc-100">Game Over</div>

      <!-- Percentile Hero -->
      <div class="mt-1 text-center">
        <div class="text-[9px] text-zinc-600 uppercase tracking-widest font-mono">estimated percentile</div>
        <div class="text-3xl font-black text-cyan-400 font-mono" id="percentileDisplay">Top —%</div>
      </div>

      <!-- Verdict -->
      <div id="verdictDisplay" class="text-xs text-zinc-300 font-mono px-2 py-1 bg-zinc-800/40 rounded">—</div>

      <!-- Flip Efficiency -->
      <div id="flipSummary" class="flex items-center gap-2 text-xs font-mono text-zinc-400 px-2 py-1 bg-zinc-800/40 rounded">
        <span id="flipEmoji">🐢</span>
        <span id="flipLabel">—</span>
      </div>

      <!-- Tempo Map -->
      <div id="tempoMap" class="tempo-map w-full mt-1"></div>

      <!-- Secondary Stats -->
      <div class="flex items-center gap-6 mt-1 font-mono text-xs">
        <div class="text-center">

// ══════════════════════════════════════════════════════════════
//  DETERMINISTIC SEEDING (Daily)
// ══════════════════════════════════════════════════════════════
function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return (h1^h2^h3^h4)>>>0;
}

function mulberry32(a) {
  return function() {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function getTodayUTC() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function getDailySeed() {
  return cyrb128(getTodayUTC() + '_fade_daily_v1');
}

function seededShuffle(arr, seed) {
  const rng = mulberry32(seed);
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// ══════════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getEmojisForLevel(count, seed) {
  const source = seed ? seededShuffle([...ALL_EMOJIS], seed) : shuffle([...ALL_EMOJIS]);
  return source.slice(0, count);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m > 0 ? `${m}:${s.toString().padStart(2,'0')}` : `0:${s.toString().padStart(2,'0')}`;
}

  const diff = tomorrow - now;

  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  dailyCountdown.textContent = `Tomorrow in ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

// Hero mini-board: 6 cards, auto-loop flip→match→fade
let heroInterval = null;
function startHeroAnimation() {
  const board = $('heroBoard');
  board.innerHTML = '';
  const emojis = ['🔥','🧠','⚡','🎯','💀','👑'];
  const cards = [];
  emojis.forEach((e, i) => {
    const c = document.createElement('div');
    c.className = 'hero-card';
    c.textContent = '·';
    c.dataset.emoji = e;
    board.appendChild(c);
    cards.push(c);
  });

  let step = 0;
  if (heroInterval) clearInterval(heroInterval);

  function tick() {
    // Reset all
    cards.forEach(c => { c.className = 'hero-card'; c.textContent = '·'; });

    if (step < 6) {
      // Flip cards one by one
      const c = cards[step];
      c.classList.add('flipped');
      c.textContent = c.dataset.emoji;
    } else if (step < 9) {
      // Show all flipped
      cards.forEach(c => { c.classList.add('flipped'); c.textContent = c.dataset.emoji; });
      // "Match" pairs
      const matchIdx = (step - 6) * 2;
      if (matchIdx < 6) {
        cards[matchIdx].classList.add('matched');
        cards[matchIdx + 1].classList.add('matched');
      }
    } else if (step < 15) {
      // Fade remaining
      cards.forEach((c, i) => {
        if (!c.classList.contains('matched')) {
          c.classList.add('flipped');
          c.textContent = c.dataset.emoji;
          c.classList.add(`faded-${Math.min(5, step - 8)}`);
        }
      });
    }

    step++;
    if (step > 15) step = 0;
  }

  tick();
  heroInterval = setInterval(tick, 200);
}

// ══════════════════════════════════════════════════════════════
//  GRID
// ══════════════════════════════════════════════════════════════
function calculateCardSize() {
  const gap = GRID_GAP;
  const wrapper = gridWrapper;
  const pad = 12;
  const availW = wrapper.clientWidth - pad;
  const availH = wrapper.clientHeight - pad;
  const maxByW = (availW - (GAME_CONFIG.GRID_COLS - 1) * gap) / GAME_CONFIG.GRID_COLS;
  const maxByH = (availH - (GAME_CONFIG.GRID_ROWS - 1) * gap) / GAME_CONFIG.GRID_ROWS;
  return Math.max(28, Math.min(maxByW, maxByH));
}

function buildGrid() {
  const count = GAME_CONFIG.GRID_ROWS * GAME_CONFIG.GRID_COLS;
  S.totalPairs = Math.floor(count / 2);
  S.matchedPairs = 0;
  S.cards = [];
  S.totalFlips = 0;
  S.flipCounts = new Array(count).fill(0);
  S.pairFlipCounts = {};

  const seed = S.mode === 'daily' ? getDailySeed() : null;
  const emojis = getEmojisForLevel(S.totalPairs, seed);
  S.emojis = emojis;
  const pairs = [...emojis, ...emojis];

  if (S.mode === 'daily') {
    const rng = mulberry32(seed + 1);
    for (let i = pairs.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
    }
  } else {
    shuffle(pairs);
  }

  // ─── Designate special pairs for this round ───
  const uniqueEmojis = [...new Set(pairs)];
  // Golden Pair: 3x score multiplier (random among all pairs)
  S.goldenEmoji = uniqueEmojis[Math.floor(Math.random() * uniqueEmojis.length)];
  // Mimic Trap: clicking its second card locks the board (different from golden)
  const remaining = uniqueEmojis.filter(e => e !== S.goldenEmoji);
  S.mimicEmoji = remaining[Math.floor(Math.random() * remaining.length)];
  // X-Ray Rare Pair: matching this triggers an auto X-Ray flash
  const remaining2 = remaining.filter(e => e !== S.mimicEmoji);
  S.xrayTriggerEmoji = remaining2.length > 0 ? remaining2[Math.floor(Math.random() * remaining2.length)] : null;
  S.goldenRevealed = false;

  const size = calculateCardSize();
  const emojiSize = Math.round(size * GAME_CONFIG.EMOJI_SCALE_PERCENT / 100);

  gridEl.style.gridTemplateColumns = `repeat(${GAME_CONFIG.GRID_COLS}, ${size}px)`;
  gridEl.style.gridTemplateRows = `repeat(${GAME_CONFIG.GRID_ROWS}, ${size}px)`;
  gridEl.style.gap = `${GRID_GAP}px`;
  gridEl.style.justifyContent = 'center';
  gridEl.style.alignContent = 'center';

  gridEl.classList.remove('grid-fade-in');
  void gridEl.offsetWidth;
  gridEl.classList.add('grid-fade-in');

  gridEl.innerHTML = '';
  S.flippedIndices = [];

  // Build underlay image grid to reveal beneath matched cards
  buildUnderlayGrid(size, pairs.length);

  pairs.forEach((emoji, idx) => {
    const cardWrapper = document.createElement('div');
    cardWrapper.className = 'card';
    cardWrapper.dataset.index = idx;
    cardWrapper.style.width = `${size}px`;
    cardWrapper.style.height = `${size}px`;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    front.textContent = emoji;
    front.style.fontSize = `${emojiSize}px`;
    front.style.lineHeight = '1';

    inner.appendChild(back);
    inner.appendChild(front);
    cardWrapper.appendChild(inner);

    cardWrapper.addEventListener('click', () => onCardClick(idx));
    cardWrapper.addEventListener('touchstart', (e) => {
      e.preventDefault();
      onCardClick(idx);
    }, { passive: false });

    gridEl.appendChild(cardWrapper);

    // Tag special cards with visual markers before hiding them
    if (emoji === S.goldenEmoji) cardWrapper.classList.add('golden-pair');
    if (emoji === S.mimicEmoji) cardWrapper.classList.add('mimic-trap');

    S.cards.push({
      emoji,
      matched: false,
      flipped: false,
      element: cardWrapper,
      index: idx,
    });
  });
}

// ══════════════════════════════════════════════════════════════
//  CARD LOGIC
// ══════════════════════════════════════════════════════════════
function onCardClick(index) {
  if (!S.gameActive) return;
  if (S.isProcessing) return;
  if (S.isBoardLocked) return; // Mimic trap penalty lock

  const card = S.cards[index];
  if (!card || card.matched || card.flipped) return;
  if (S.flippedIndices.includes(index)) return;

  card.flipped = true;
  card.element.classList.add('flipped');
  S.flippedIndices.push(index);
  S.totalFlips++;
  S.flipCounts[index]++;
  S.pairFlipCounts[card.emoji] = (S.pairFlipCounts[card.emoji] || 0) + 1;

  if (S.flippedIndices.length === 2) {
    S.isProcessing = true;
    S.moves++;
    movesDisplay.textContent = S.moves;
    movesDisplayCompact.textContent = S.moves;

    // Mimic Trap: if either flipped card is the mimic, the board locks for 3s
    const firstIdx = S.flippedIndices[0];
    const secondIdx = S.flippedIndices[1];
    const firstCard = S.cards[firstIdx];
    const secondCard = S.cards[secondIdx];
    if (GAME_CONFIG.MIMIC_TRAP &&
        (firstCard.emoji === S.mimicEmoji || secondCard.emoji === S.mimicEmoji)) {
      triggerMimicPenalty();
    }

    setTimeout(checkMatch, 400);
  }
}

function checkMatch() {
  const [i1, i2] = S.flippedIndices;
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  if (c1.emoji === c2.emoji) {
    handleMatch(i1, i2);
  } else {
    handleMismatch(i1, i2);
  }
}

function handleMatch(i1, i2) {
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  c1.matched = true;
  c2.matched = true;
  c1.element.classList.add('matched');
  c2.element.classList.add('matched');

  // Underlay Reveal: matched cards fade to show background image beneath
  if (GAME_CONFIG.UNDERLAY_REVEAL) {
    c1.element.classList.add('reveal-underlay');
    c2.element.classList.add('reveal-underlay');
  }

  S.matchedPairs++;

  const now = performance.now();
  if (S.lastMatchTime && (now - S.lastMatchTime < COMBO_WINDOW)) {
    S.combo++;
  } else {
    S.combo = 0;
  }
  S.lastMatchTime = now;

  if (S.combo > S.maxCombo) S.maxCombo = S.combo;

  addTime(MATCH_TIME_BONUS);

  const midX = (c1.element.getBoundingClientRect().left + c2.element.getBoundingClientRect().right) / 2;
  const midY = Math.min(c1.element.getBoundingClientRect().top, c2.element.getBoundingClientRect().top) - 14;

  let multiplier = S.combo + 1;

  // Golden Pair: 3x multiplier on this match
  const isGolden = (c1.emoji === S.goldenEmoji);
  if (GAME_CONFIG.GOLDEN_PAIR && isGolden) {
    multiplier = Math.max(multiplier, 3);
    S.goldenRevealed = true;
    showFloatingText('✨ GOLDEN ✨', midX, midY - 28);
  }

  const points = BASE_SCORE * multiplier;
  S.score += points;

  const label = S.combo >= 1 ? `+${points}x${multiplier}` : `+${points}`;
  showFloatingText(label, midX, midY);

  if (S.combo >= 3) {
    spawnConfetti(midX, midY);
    // Earn an X-Ray charge on 3+ combo
    if (S.xrayCharges < XRAY_MAX_STORED) {
      S.xrayCharges++;
      updateXrayUI();
    }
  }

  S.flipHistory.push(S.combo >= 3 ? '🔥' : '🟩');
  S.pairTimes.push(performance.now() - S.sessionStartTime);

  // X-Ray Rare Pair: matching the trigger emoji auto-flashes all face-down cards for 0.6s
  if (GAME_CONFIG.XRAY_RARE_PAIR && c1.emoji === S.xrayTriggerEmoji) {
    triggerXrayFlash();
  }

  updateScore();
  updateComboDisplay();

  if (S.matchedPairs >= S.totalPairs) {
    setTimeout(victory, 700);
    S.flippedIndices = [];
    return;
  }

  S.flippedIndices = [];
  S.isProcessing = false;
}

function handleMismatch(i1, i2) {
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];
  const el1 = c1.element;
  const el2 = c2.element;

  el1.classList.add('mismatch');
  el2.classList.add('mismatch');

  S.combo = 0;
  updateComboDisplay();

  S.flipHistory.push('🟥');

  // ─── Golden Pair shuffle penalty ───
  // If a player reveals ONE golden card but mismatches it,
  // that golden card + its pair must swap with two other unrevealed cards.
  if (GAME_CONFIG.GOLDEN_PAIR && !S.goldenRevealed) {
    const goldenFlipped = (c1.emoji === S.goldenEmoji) ? i1 : (c2.emoji === S.goldenEmoji) ? i2 : -1;
    if (goldenFlipped !== -1) {
      setTimeout(() => shuffleGoldenPair(goldenFlipped), 520);
    }
  }

  // ─── Amnesia Penalty: track identical mistakes ───
  if (GAME_CONFIG.AMNESIA_PENALTY) {
    const key = [i1, i2].sort((a,b) => a-b).join(',');
    S.mistakeTracker[key] = (S.mistakeTracker[key] || 0) + 1;
    S.lastMistakeKey = key;
    if (S.mistakeTracker[key] >= 3) {
      // Reset tracker for this pair and trigger clown penalty
      S.mistakeTracker[key] = 0;
      setTimeout(() => applyClownPenalty(i1, i2), 520);
    }
  }

  setTimeout(() => {
    el1.classList.remove('flipped','mismatch');
    el2.classList.remove('flipped','mismatch');
    c1.flipped = false;
    c2.flipped = false;
    S.flippedIndices = [];
    S.isProcessing = false;
  }, 500);
}

// ══════════════════════════════════════════════════════════════
//  UNDERLAY GRID
// ══════════════════════════════════════════════════════════════
function buildUnderlayGrid(cellSize, totalCards) {
  if (!GAME_CONFIG.UNDERLAY_REVEAL) return;
  underlayGrid.innerHTML = '';
  underlayGrid.style.gridTemplateColumns = `repeat(${GAME_CONFIG.GRID_COLS}, ${cellSize}px)`;
  underlayGrid.style.gridTemplateRows = `repeat(${GAME_CONFIG.GRID_ROWS}, ${cellSize}px)`;
  underlayGrid.style.gap = `${GRID_GAP}px`;
  underlayGrid.style.justifyContent = 'center';
  underlayGrid.style.alignContent = 'center';

  // Abstract geometric pattern for the underlay (CSS-only, no external image)
  for (let i = 0; i < totalCards; i++) {
    const cell = document.createElement('div');
    cell.className = 'underlay-cell';
    // Generate a unique abstract swatch per cell using CSS conic-gradient
    const hue = (i * 47 + 200) % 360;
    const sat = 30 + (i % 5) * 10;
    const light = 12 + (i % 4) * 4;
    cell.style.background = `conic-gradient(from ${i * 30}deg, hsl(${hue},${sat}%,${light}%), hsl(${(hue+60)%360},${sat}%,${light+6}%))`;
    underlayGrid.appendChild(cell);
  }
}

// ══════════════════════════════════════════════════════════════
//  GOLDEN PAIR SHUFFLE
// ══════════════════════════════════════════════════════════════
function shuffleGoldenPair(goldenFlippedIndex) {
  if (!S.gameActive) return;
  const goldenCard = S.cards[goldenFlippedIndex];
  const goldenEmoji = goldenCard.emoji;

  // Find the OTHER golden card (the pair)
  const otherGoldenIdx = S.cards.findIndex((c, idx) =>
    idx !== goldenFlippedIndex && c.emoji === goldenEmoji && !c.matched
  );
  if (otherGoldenIdx === -1) return;

  // Collect 2 random unrevealed, unmatched non-golden cards
  const candidates = S.cards
    .map((c, idx) => ({ c, idx }))
    .filter(({ c, idx }) =>
      !c.matched && !c.flipped && c.emoji !== goldenEmoji
    );

  if (candidates.length < 2) return;

  // Shuffle candidates and pick 2
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  const swapA = candidates[0];
  const swapB = candidates[1];

  // Perform swap in data
  const tempEmoji = S.cards[otherGoldenIdx].emoji;
  S.cards[otherGoldenIdx].emoji = swapA.c.emoji;
  S.cards[swapA.idx].emoji = tempEmoji;

  // Perform swap in DOM (front text + special classes)
  const otherEl = S.cards[otherGoldenIdx].element;
  const swapAEl = swapA.c.element;

  const otherFront = otherEl.querySelector('.card-front');
  const swapAFront = swapAEl.querySelector('.card-front');
  const tmpText = otherFront.textContent;
  otherFront.textContent = swapAFront.textContent;
  swapAFront.textContent = tmpText;

  // Transfer special classes
  otherEl.classList.remove('golden-pair');
  swapAEl.classList.add('golden-pair');

  // Brief flash to signal the shuffle happened
  [otherEl, swapAEl, S.cards[goldenFlippedIndex].element, swapB.c.element].forEach(el => {
    el.style.transition = 'transform 0.2s ease';
    el.style.transform = 'scale(0.92)';
    setTimeout(() => { el.style.transform = ''; }, 220);
  });

  // If the swapped-in card was the mimic, update mimic class too
  if (S.cards[otherGoldenIdx].emoji === S.mimicEmoji) {
    otherEl.classList.add('mimic-trap');
    swapAEl.classList.remove('mimic-trap');
  }
}

// ══════════════════════════════════════════════════════════════
//  MIMIC TRAP PENALTY
// ══════════════════════════════════════════════════════════════
function triggerMimicPenalty() {
  if (S.isBoardLocked) return;
  S.isBoardLocked = true;
  gameEl.classList.add('board-locked');

  const timerEl = document.createElement('div');
  timerEl.className = 'board-lock-timer';
  timerEl.textContent = '⚠️ BOARD LOCKED — 3s';
  document.body.appendChild(timerEl);

  let remaining = 3;
  const countdown = setInterval(() => {
    remaining--;
    if (remaining > 0) {
      timerEl.textContent = `⚠️ BOARD LOCKED — ${remaining}s`;
    } else {
      clearInterval(countdown);
    }
  }, 1000);

  S.boardLockTimer = setTimeout(() => {
    S.isBoardLocked = false;
    gameEl.classList.remove('board-locked');
    timerEl.remove();
    clearInterval(countdown);
  }, 3000);
}

// ══════════════════════════════════════════════════════════════
//  AMNESIA / CLOWN PENALTY
// ══════════════════════════════════════════════════════════════
function applyClownPenalty(i1, i2) {
  if (!S.gameActive) return;
  const c1 = S.cards[i1];
  const c2 = S.cards[i2];

  // Screen shake on the game screen
  gameEl.classList.add('screen-shake');
  setTimeout(() => gameEl.classList.remove('screen-shake'), 450);

  // Temporarily change both mismatched cards to clown emoji
  const front1 = c1.element.querySelector('.card-front');
  const front2 = c2.element.querySelector('.card-front');
  const orig1 = front1.textContent;
  const orig2 = front2.textContent;

  front1.textContent = '🤡';
  front2.textContent = '🤡';

  // Show a floating text
  const rect = c1.element.getBoundingClientRect();
  showFloatingText('🤡 Amnesia!', rect.left + rect.width/2, rect.top - 10);

  // Flip back after 2 seconds
  setTimeout(() => {
    if (!S.gameActive) return;
    front1.textContent = orig1;
    front2.textContent = orig2;
  }, 2000);
}

// ══════════════════════════════════════════════════════════════
//  X-RAY AUTO FLASH (Rare Pair Reward)
// ══════════════════════════════════════════════════════════════
function triggerXrayFlash() {
  if (!S.gameActive) return;

  // Visual flash overlay
  const flash = document.createElement('div');
  flash.className = 'xray-flash-overlay';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 650);

  // Flip all unrevealed, unmatched cards face-up
  const faceDown = S.cards.filter(c => !c.matched && !c.flipped);
  faceDown.forEach(c => c.element.classList.add('flipped'));

  // Flip them back down after 0.6s
  setTimeout(() => {
    faceDown.forEach(c => {
      if (!c.matched) c.element.classList.remove('flipped');
    });
  }, 600);
}

// ══════════════════════════════════════════════════════════════
//  X-RAY (Earned)
// ══════════════════════════════════════════════════════════════
function activateXray() {
  if (!S.gameActive || S.xrayCharges <= 0) return;

  const faceDown = [];
  S.cards.forEach((card) => {
    if (!card.matched && !card.flipped) {
      faceDown.push(card);
    }
  });

  if (faceDown.length === 0) return;

  faceDown.forEach(card => { card.element.classList.add('flipped'); });

  setTimeout(() => {
    faceDown.forEach(card => {
      if (!card.matched) card.element.classList.remove('flipped');
    });
  }, 500);

  S.xrayCharges--;
  updateXrayUI();
}

function updateXrayUI() {
  const label = S.xrayCharges > 0 ? `👁️×${S.xrayCharges}` : '👁️×0';
  xrayHud.textContent = label;
  xrayLabel.textContent = S.xrayCharges > 0 ? `${S.xrayCharges} peek${S.xrayCharges>1?'s':''}` : 'peek';
  if (S.xrayCharges === 0) {
    xrayBtn.classList.add('opacity-40');
  } else {
    xrayBtn.classList.remove('opacity-40');
  }
}

function spawnConfetti(x, y) {
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ff9f43'];

// ══════════════════════════════════════════════════════════════
//  VISUAL FADE DECAY
// ══════════════════════════════════════════════════════════════
function startFadeDecay() {
  stopFadeDecay();
  S.fadeLevel = 0;
  // Fade interval scales with card count so bigger boards aren't unfairly rushed
  // 12 cards ≈ 16s  /  16 cards ≈ 19s  /  20 cards ≈ 21s  /  24 cards ≈ 23s per level
  const interval = 9000 + S.totalPairs * 1200;
  S.fadeTimer = setInterval(() => {
    if (!S.gameActive) return;
    S.fadeLevel++;
    if (S.fadeLevel > 5) { stopFadeDecay(); return; }
    S.cards.forEach(card => {
      if (!card.matched && !card.flipped) {
        // remove old faded classes
        for (let i = 1; i <= 5; i++) card.element.classList.remove(`faded-${i}`);
        card.element.classList.add(`faded-${Math.min(5, S.fadeLevel)}`);
      }
    });
  }, interval);
}

function stopFadeDecay() {
  if (S.fadeTimer) { clearInterval(S.fadeTimer); S.fadeTimer = null; }
}

// ══════════════════════════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════════════════════════
function startTimer() {
  stopTimer();
  S.timeLeft = START_TIME;
  S.maxTime = START_TIME;
  updateTimerBar();
  S.timerId = setInterval(() => {
    const drainMultiplier = GAME_CONFIG.ACCELERATE_TIMER ? 1 + S.matchedPairs * 0.05 : 1;
    S.timeLeft -= (TIMER_INTERVAL / 1000) * drainMultiplier;
    if (S.timeLeft <= 0) {
      S.timeLeft = 0;
      updateTimerBar();
      gameOver();
    } else {
      updateTimerBar();
    }
  }, TIMER_INTERVAL);
}

function stopTimer() {
  if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
}

function addTime(sec) {
  S.timeLeft += sec;
  S.timeLeft = Math.min(S.timeLeft, S.maxTime + 5);
  updateTimerBar();
}

function updateTimerBar() {
  const pct = Math.max(0, (S.timeLeft / S.maxTime) * 100);
  timerBarTop.style.width = `${pct}%`;
  const color = pct <= 25 ? '#f59e0b' : '#22d3ee';
  timerBarTop.style.background = color;
  timerBarTop.classList.toggle('timer-critical', pct <= 10 && S.gameActive);
  const adrenaline = S.gameActive && pct <= ADRENALINE_THRESHOLD * 100;
  gameEl.classList.toggle('adrenaline-mode', adrenaline);
}

// ══════════════════════════════════════════════════════════════
//  UI UPDATES
// ══════════════════════════════════════════════════════════════
function updateScore() {
  scoreDisplay.textContent = S.score;
  scoreDisplayCompact.textContent = S.score;
  movesDisplay.textContent = S.moves;
  movesDisplayCompact.textContent = S.moves;
}

function updateComboDisplay() {
  const show = S.combo > 0;
  comboDisplay.classList.toggle('hidden', !show);
  comboDisplayCompact.classList.toggle('hidden', !show);
  comboCount.textContent = `x${S.combo + 1}`;
  comboCountCompact.textContent = `x${S.combo + 1}`;
  // Pulse animation
  if (show) {
    comboDisplay.classList.add('combo-pulse');
    comboDisplayCompact.classList.add('combo-pulse');
    setTimeout(() => {
      comboDisplay.classList.remove('combo-pulse');
      comboDisplayCompact.classList.remove('combo-pulse');
    }, 350);
  }
}

// ══════════════════════════════════════════════════════════════
//  GAME OVER / VICTORY
// ══════════════════════════════════════════════════════════════
function gameOver() {
  S.gameActive = false;
  stopTimer();
  stopFadeDecay();
  if (S.boardLockTimer) { clearTimeout(S.boardLockTimer); S.boardLockTimer = null; }
  S.isBoardLocked = false;
  gameEl.classList.remove('board-locked');
  showOverlay('💀', 'Game Over');
}

function victory() {
  S.gameActive = false;
  stopTimer();
  stopFadeDecay();
  if (S.boardLockTimer) { clearTimeout(S.boardLockTimer); S.boardLockTimer = null; }
  S.isBoardLocked = false;
  gameEl.classList.remove('board-locked');
  showOverlay('🏆', 'Victory!');
}

function showOverlay(headerEmoji, titleText) {
  gameEl.classList.remove('adrenaline-mode');
  xrayContainer.classList.add('hidden');

  overlayHeader.textContent = headerEmoji;
  overlayTitle.textContent = titleText;
  finalScore.textContent = S.score;
  finalCombo.textContent = S.maxCombo + 1;
  finalMoves.textContent = S.moves;

  // Percentile (estimated from hardcoded curve)
  const pct = computePercentile(S.score);
  percentileDisplay.textContent = `Top ${pct}%`;

  // Tempo map
  renderTempoMap();

  // Verdict
  verdictDisplay.textContent = generateVerdict();

  // Flip efficiency
  const minFlips = S.matchedPairs * 2;
  const extraFlips = Math.max(0, S.totalFlips - minFlips);
  let animal = '🐢', label = 'Turtle pace';
  if (extraFlips <= 3) { animal = '🐆'; label = 'Cheetah speed'; }
  else if (extraFlips <= 5) { animal = '🐇'; label = 'Rabbit hops'; }
  flipEmoji.textContent = animal;
  flipLabel.textContent = `${S.totalFlips} flips · ${label}`;

  // Tomorrow countdown (daily mode)
  if (S.mode === 'daily') {
    tomorrowCountdown.classList.remove('hidden');
    updateTomorrowCountdown();
    if (!window._tomorrowInterval) {
      window._tomorrowInterval = setInterval(updateTomorrowCountdown, 1000);
    }
  } else {
    tomorrowCountdown.classList.add('hidden');
  }

  gameOverlay.classList.remove('hidden');

  // Persist stats
  persistStats(headerEmoji === '🏆');
}

function computePercentile(score) {
  for (let i = PERCENTILE_CURVE.length - 1; i >= 0; i--) {
    if (score >= PERCENTILE_CURVE[i].min) {
      // Add slight daily variance so it feels organic
      const seed = cyrb128(getTodayUTC() + '_pct');
      const variance = (seed % 5) - 2; // -2 to +2
      return Math.max(1, Math.min(99, PERCENTILE_CURVE[i].pct + variance));
    }
  }
  return 99;
}

function renderTempoMap() {
  // One cell per pair, colored by how many times it was flipped.
  // Perfect = 2 flips (both cards found first try). More flips = struggled more.
  tempoMapEl.innerHTML = '';
  const total = S.totalPairs;

  // Dynamic columns: make the grid look balanced for any pair count
  let cols = 5;
  if (total <= 4) cols = total;
  else if (total <= 6) cols = 3;
  else if (total <= 8) cols = 4;
  else if (total <= 10) cols = 5;
  else cols = 4; // 12 pairs -> 3 rows of 4
  tempoMapEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  S.emojis.forEach((emoji) => {
    const flips = S.pairFlipCounts[emoji] || 0;
    const cell = document.createElement('div');
    cell.className = 'tempo-cell';

    // 0 = never flipped, 2 = perfect, 3-4 = okay, 5+ = struggled
    if (flips === 0) {
      cell.classList.add('tempo-empty');
      cell.textContent = '·';
    } else if (flips <= 2) {
      cell.classList.add('tempo-fast');
      cell.textContent = '⚡';
    } else if (flips <= 4) {
      cell.classList.add('tempo-med');
      cell.textContent = flips;
    } else {
      cell.classList.add('tempo-slow');
      cell.textContent = flips;
    }
    tempoMapEl.appendChild(cell);
  });
}

function generateVerdict() {
  const times = S.pairTimes;
  if (times.length < 3) return 'Keep practicing.';

  // Split into quartiles
  const q1 = times.slice(0, Math.ceil(times.length * 0.25));
  const q2 = times.slice(Math.ceil(times.length * 0.25), Math.ceil(times.length * 0.5));
  const q3 = times.slice(Math.ceil(times.length * 0.5), Math.ceil(times.length * 0.75));
  const q4 = times.slice(Math.ceil(times.length * 0.75));

  const avg = arr => arr.reduce((a,b) => a+b,0) / (arr.length||1);
  const a1 = avg(q1), a2 = avg(q2), a3 = avg(q3), a4 = avg(q4);

  // flawless: all fast
  if (a1 < 10000 && a2 < 10000 && a3 < 10000 && a4 < 10000) return 'Clean run.';
  // cold-start: slow first, fast finish
  if (a1 > a2 && a2 > a3 && a3 > a4 && a1 > 15000) return 'Slow start, strong finish.';
  // panic-recovery: V-shape (slow middle, fast ends)
  if (a2 > a1 && a2 > a3 && a3 < a2) return 'Clutch recovery.';
  // collapse: degrading
  if (a1 < a2 && a2 < a3 && a3 < a4) return 'Lost the thread.';
  // default
  return 'Solid effort.';
}

function updateTomorrowCountdown() {
  const now = new Date();
  const tomorrow = new Date(now);
  tomorrow.setUTCDate(tomorrow.getUTCDate() + 1);
  tomorrow.setUTCHours(0, 0, 0, 0);
  const diff = tomorrow - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  tomorrowCountdown.textContent = `Tomorrow's challenge in ${h}h ${m}m ${s}s`;
}

function persistStats(won) {
  const count = GAME_CONFIG.GRID_ROWS * GAME_CONFIG.GRID_COLS;
  STATS.tierPlays[count] = (STATS.tierPlays[count] || 0) + 1;
  if (won) {
    STATS.tierWins[count] = (STATS.tierWins[count] || 0) + 1;
  }
  // Rolling average moves
  const oldAvg = STATS.tierAvgMoves[count] || 0;
  const oldN = STATS.tierPlays[count] - 1;
  STATS.tierAvgMoves[count] = Math.round((oldAvg * oldN + S.moves) / STATS.tierPlays[count]);

  const today = getTodayUTC();
  STATS.lastDate = today;

  if (won) {
    STATS.streak = (STATS.streak || 0) + 1;
    STATS.maxStreak = Math.max(STATS.maxStreak || 0, STATS.streak);
  } else {
    STATS.streak = 0;
  }

  if (S.mode === 'daily') {
    STATS.dailyPlayed = today;
    STATS.dailyWon = won;
  }

  saveStats(STATS);
}

// ══════════════════════════════════════════════════════════════
//  SHARE
// ══════════════════════════════════════════════════════════════
function shareScore() {
  const pct = computePercentile(S.score);
  const verdict = generateVerdict();
  const cardCount = GAME_CONFIG.GRID_ROWS * GAME_CONFIG.GRID_COLS;
  const isDaily = S.mode === 'daily';

  // Build tempo map rows for share (5 per row, using emojis)
  let tempoRows = [];
  const total = S.totalPairs;
  const perRow = 5;
  const pairsPerCell = Math.max(1, Math.ceil(total / 20));
  for (let i = 0; i < total; i += pairsPerCell) {
    let sum = 0, cnt = 0;
    for (let p = i; p < i + pairsPerCell && p < S.pairTimes.length; p++) {
      sum += S.pairTimes[p]; cnt++;
    }
    const avg = cnt > 0 ? sum / cnt : 0;
    tempoRows.push(avg < 8000 ? '⚡' : avg < 18000 ? '🟨' : '🟥');
  }
  // Group into rows of 5
  let tempoStr = '';
  for (let i = 0; i < tempoRows.length; i += perRow) {
    tempoStr += tempoRows.slice(i, i + perRow).join('') + '\n';
  }

  const header = isDaily ? `🧠 FADE DAILY — ${getTodayUTC()}` : `🧠 FADE: ${cardCount}-CARD CHALLENGE`;
  const text = [
    header,
    ``,
    `🏆 Top ${pct}% today`,
    `⏱️ ${formatTime(Math.floor(S.timeLeft))} | 🕹️ ${S.moves} moves`,
    `🔥 x${S.maxCombo + 1} combo`,
    ``,
    tempoStr.trim(),
    ``,
    `💬 ${verdict}`,
    ``,
    `⚡ ${GAME_URL}`,
  ].join('\n');

  // Web Share API
  if (navigator.share) {
    navigator.share({ title: 'FADE', text }).catch(() => {});
  }
  // Clipboard
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showShareCopied()).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showShareCopied(); } catch (e) { alert('Tap to copy:\n\n' + text); }
  document.body.removeChild(ta);
}

function showShareCopied() {
  shareBtn.innerHTML = 'Copied! 📋';
  shareBtn.classList.add('bg-emerald-800', 'border-emerald-700');
  shareBtn.classList.remove('bg-zinc-800', 'border-zinc-700/60');
  setTimeout(() => {
    shareBtn.innerHTML = '<span>📤</span> Share';
    shareBtn.classList.remove('bg-emerald-800', 'border-emerald-700');
    shareBtn.classList.add('bg-zinc-800', 'border-zinc-700/60');
  }, 1500);
}

// ══════════════════════════════════════════════════════════════
//  RESTART / NAVIGATION
// ══════════════════════════════════════════════════════════════
function playAgain() {
  stopTimer();
  stopFadeDecay();
  gameOverlay.classList.add('hidden');
  xrayContainer.classList.remove('hidden');

  S.score = 0; S.combo = 0; S.maxCombo = 0; S.moves = 0;
  S.flipHistory = []; S.pairTimes = [];
  S.matchedPairs = 0; S.flippedIndices = [];
  S.isProcessing = false; S.gameActive = false; S.xrayCharges = 0;
  S.fadeLevel = 0;
  S.goldenEmoji = null; S.mimicEmoji = null; S.xrayTriggerEmoji = null;
  S.isBoardLocked = false; S.boardLockTimer = null;
  S.mistakeTracker = {}; S.lastMistakeKey = null;
  S.goldenRevealed = false;

  updateXrayUI();

  shareBtn.innerHTML = '<span>📤</span> Share';
  shareBtn.classList.remove('bg-emerald-800', 'border-emerald-700');
  shareBtn.classList.add('bg-zinc-800', 'border-zinc-700/60');

  updateScore();
  updateComboDisplay();
  initGame();
}

function backToMenu() {
  stopTimer();
  stopFadeDecay();
  // Clear any active board lock
  if (S.boardLockTimer) { clearTimeout(S.boardLockTimer); S.boardLockTimer = null; }
  S.isBoardLocked = false;
  gameEl.classList.remove('board-locked');
  gameOverlay.classList.add('hidden');
  xrayContainer.classList.remove('hidden');
  if (heroInterval) clearInterval(heroInterval);
  showScreen('landing');
  initLanding();
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
function initGame() {
  S.gameActive = false;
  S.xrayCharges = 0;
  S.fadeLevel = 0;
  S.sessionStartTime = performance.now();
  S.isBoardLocked = false;
  S.boardLockTimer = null;
  S.mistakeTracker = {};
  S.lastMistakeKey = null;
  S.goldenRevealed = false;

  buildGrid();
  updateScore();
  updateComboDisplay();
  updateXrayUI();

  S.gameActive = true;
  startTimer();
  startFadeDecay();
}

// ─── Handle resize/orientation change ───
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (S.gameActive) {
      const matchedEmojis = S.cards.filter(c => c.matched).map(c => c.emoji);
      buildGrid();
      S.cards.forEach(c => {
        if (matchedEmojis.includes(c.emoji)) {
          c.matched = true;
          c.flipped = true;
          c.element.classList.add('flipped', 'matched');
        }
      });
      // Restore fade levels
      S.cards.forEach(c => {
        if (!c.matched && !c.flipped && S.fadeLevel > 0) {
          c.element.classList.add(`faded-${Math.min(5, S.fadeLevel)}`);
        }
      });
    }
  }, 200);
});

function getGridDims(count) {
  const cols = 4;
  const rows = count / cols;
  return { rows, cols };
}

function getCardCount() {
  const saved = localStorage.getItem('fade_card_count');
  const count = saved ? parseInt(saved, 10) : 16;
  return [12, 16, 20, 24].includes(count) ? count : 16;
}

// ─── Button hooks ───
xrayBtn.addEventListener('click', activateXray);
shareBtn.addEventListener('click', shareScore);
replayBtn.addEventListener('click', playAgain);
backBtn.addEventListener('click', backToMenu);

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') playAgain();
  if (e.key === 'x' || e.key === 'X') activateXray();
  if (e.key === 'Escape') backToMenu();
});

// ─── Go! ───
initLanding();
</script>
